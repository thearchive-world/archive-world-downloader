modLoader = "javafml"
loaderVersion = "[1,)"
license = "LGPL-3.0-or-later"
issueTrackerURL = "https://github.com/thearchive-world/archive-world-downloader/issues/new/choose"

# NB: deliberately no services array. NeoForge loads a mod jar that has no module-info.java as a JPMS automatic module,
# and the services array makes FML declare module uses directives on it, which JPMS forbids for automatic modules
# ("Automatic modules can not declare service dependences", crashes FMLLoader at startup in the client).

[[mods]]
modId = "wdl"
version = "${version}"
displayName = "Archive World Downloader"
authors = "terbin"
displayURL = "https://wdl.docs.thearchive.world/"
description = "Keep the multiplayer worlds you visit. As you explore, the mod saves the terrain, mobs, and maps around you into a singleplayer world you can open offline, and containers save their contents when you open them. Everything comes from your own game, so nothing runs on the server."
logoFile = "icon.png"
logoBlur = false

[[dependencies.wdl]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version_min},)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.wdl]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "AFTER"
side = "CLIENT"
