# WDL: NeoForge access transformer (auto-loaded at runtime from this path; auto-applied at
# compile time by ModDevGradle from src/main/resources/META-INF/accesstransformer.cfg).
#
# Why: the loader-agnostic codec in :common reuses vanilla's own
# serialization by constructing net.minecraft...SerializableChunkData directly (the "replicate-the-
# slice" design). Mojang's ORIGINAL bytecode declares that record's canonical constructor PUBLIC, so
# the Fabric/Loom build (which remaps Mojang's official bytecode) compiles it fine with no widening.
# NeoForge, however, ships Minecraft via the NeoForm pipeline (decompile -> patch -> RECOMPILE), and
# the decompiler reconstructs SerializableChunkData's canonical ctor as an explicit, package-private
# @Deprecated SerializableChunkData(...) (the public modifier is not preserved; the sibling
# SectionData ctor stays public). The recompiled NeoForge classpath therefore exposes a package-
# private ctor, and new SerializableChunkData(...) from package world.thearchive.wdl.adapter.* is
# rejected ("not public ... cannot be accessed from outside package"). This AT restores public access
# on the NeoForge side only, the NeoForge-idiomatic analog of a Fabric AccessWidener. core/ and the
# adapter SPI are untouched; this is per-loader (and per-era-band: the descriptor's first arg is the
# 1.21.10+ PalettedContainerFactory; the 1.21.4 band uses Registry<Biome> and regenerates this line).
public net.minecraft.world.level.chunk.storage.SerializableChunkData <init>(Lnet/minecraft/core/Registry;Lnet/minecraft/world/level/ChunkPos;IJJLnet/minecraft/world/level/chunk/status/ChunkStatus;Lnet/minecraft/world/level/levelgen/blending/BlendingData$Packed;Lnet/minecraft/world/level/levelgen/BelowZeroRetrogen;Lnet/minecraft/world/level/chunk/UpgradeData;[JLjava/util/Map;Lnet/minecraft/world/level/chunk/ChunkAccess$PackedTicks;[Lit/unimi/dsi/fastutil/shorts/ShortList;ZLjava/util/List;Ljava/util/List;Ljava/util/List;Lnet/minecraft/nbt/CompoundTag;)V

