# Architectury Loom switches to its Forge toolchain only when this property is set; without it Loom configures a
# Fabric build and the forge dependency has no target. It lives here, in the island's own gradle.properties,
# rather than the root band coordinates because it is a build-tool setting, not a band coordinate.
loom.platform=forge
org.gradle.jvmargs=-Xmx3G
