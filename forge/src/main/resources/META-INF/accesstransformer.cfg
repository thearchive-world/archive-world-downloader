# WDL: Forge access transformer in the classic Forge 1.16.x form, MCP class names plus SRG field_NNNNN_ member
# ids. Architectury Loom widens the named (Mojang-official) dev classpath by remapping these to named, then ships
# this file verbatim; Forge auto-loads it at runtime from this path (ModFile.getAccessTransformer resolves
# META-INF/accesstransformer.cfg with no manifest attribute), where the vanilla classes are SRG-named. These are
# the same read-only, visibility-only field widenings the Fabric build declares in wdl.accesswidener, restated in
# AT syntax. There is no SerializableChunkData widening because that record does not exist at this band (the common
# codec builds its own band-stable carrier), so this mirrors what the source-merged common actually reads.

# Both the class name and the member id are SRG here, not Mojmap: below the 1.17 Great Rename the Forge runtime
# classes keep the pre-1.17 net.minecraft.network.play.server layout and the classic field_NNNNN_ member scheme,
# while the 1.17-and-above bands use the net.minecraft.network.protocol.game layout and the TSRGv2 f_NNNNN_ scheme.
# A Mojmap name here would match nothing at runtime and leave the field private. The trailing comment gives the
# Mojmap name the source reads. The SRG names are per-version and are regenerated when this file is ported to
# another band. public (not public-f) keeps the final flag, since every read here is read-only.

# The connection packet tee reaches the connection's Netty pipeline through the private, non-final channel.
public net.minecraft.network.NetworkManager field_150746_k # channel (Connection)

# A relative-move packet (the common walk update) carries its entity id and its short position deltas in protected
# fields with no public getters, so the tee reads them to feed the move to the accumulator off the Netty thread.
public net.minecraft.network.play.server.SEntityPacket field_149074_a # entityId (ClientboundMoveEntityPacket)
public net.minecraft.network.play.server.SEntityPacket field_149072_b # xa
public net.minecraft.network.play.server.SEntityPacket field_149073_c # ya
public net.minecraft.network.play.server.SEntityPacket field_149070_d # za

# A mount inventory menu names the animal the server opened it for in a non-public field with no getter, so the
# open-container bind reads it rather than inferring the animal from the crosshair or the ridden vehicle.
public net.minecraft.inventory.container.HorseInventoryContainer field_111242_f # horse (HorseInventoryMenu)
