# WDL: Forge access transformer in the classic Forge 1.16.x form, MCP class names plus SRG field_NNNNN_ member
# ids. This Unimined band has no Architectury Loom and no Mojmap compile view, so there is no compile-time
# widening step; this file ships verbatim, where the vanilla classes are SRG-named. Unlike the ModLauncher-era
# ModFile.getAccessTransformer convention-path lookup, legacy FML at this band does not auto-discover this file
# by its META-INF path; the shipped jar's manifest carries FMLAT: accesstransformer.cfg (set on modJar in
# build.gradle.kts) so FML's coremod-manager loads it. These are the same read-only, visibility-only field
# widenings the Fabric build declares in wdl.accesswidener, restated in AT syntax. There is no
# SerializableChunkData widening because that record does not exist at this band (the common codec builds its
# own band-stable carrier), so this mirrors what the source-merged common actually reads.

# Both the class name and the member id are SRG here, not Mojmap: below the 1.17 Great Rename the Forge runtime
# classes keep the pre-1.17 net.minecraft.network.play.server layout and the classic field_NNNNN_ member scheme,
# while the 1.17-and-above bands use the net.minecraft.network.protocol.game layout and the TSRGv2 f_NNNNN_ scheme.
# A Mojmap name here would match nothing at runtime and leave the field private. The trailing comment gives the
# Mojmap name the source reads. The SRG names are per-version and are regenerated when this file is ported to
# another band. public (not public-f) keeps the final flag, since every read here is read-only.

# A relative-move packet (the common walk update) carries its entity id in a protected field with no public getter,
# so the tee reads it through this widening. Its position deltas have public getters (getXa/getYa/getZa) at this
# band, so the tee reads those and the delta fields need no widening.
public net.minecraft.network.play.server.SPacketEntity field_149074_a # entityId (ClientboundMoveEntityPacket)

# A mount inventory menu names the animal the server opened it for in a non-public field with no getter, so the
# open-container bind reads it rather than inferring the animal from the crosshair or the ridden vehicle.
public net.minecraft.inventory.ContainerHorseInventory field_111242_f # horse (HorseInventoryMenu)
