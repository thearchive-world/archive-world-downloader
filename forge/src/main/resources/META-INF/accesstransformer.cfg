# WDL: Forge access transformer (applied at compile time by ForgeGradle from the accessTransformer entry in
# forge/build.gradle.kts; auto-loaded at runtime from this path by ModLauncher). These are the same three
# read-only, visibility-only field widenings the Fabric build declares in wdl.accesswidener, restated in AT
# syntax. There is no SerializableChunkData widening because that record does not exist at this band (the common
# codec builds its own band-stable carrier), so this mirrors what the source-merged common actually reads.

# Names are SRG (f_NNNNN_), not Mojmap: ForgeGradle applies ATs to the SRG-named jar and Forge's runtime classes
# are SRG-named, so a Mojmap name here silently matches nothing and leaves the field private. The trailing
# comment gives the Mojmap name. The SRG numbers are per-version and are regenerated when this file is ported to
# another band. public (not public-f) keeps the final flag, since every read here is read-only.

# The connection packet tee reaches the connection's Netty pipeline through the private, non-final channel.
public net.minecraft.network.Connection f_129468_ # channel

# A relative-move packet (the common walk update) carries its entity id in a protected field with no public
# getter, so the tee reads it to feed the move to the accumulator off the Netty thread.
public net.minecraft.network.protocol.game.ClientboundMoveEntityPacket f_132499_ # entityId

# A mount inventory menu names the animal the server opened it for in a non-public field with no getter, so the
# open-container bind reads it rather than inferring the animal from the crosshair or the ridden vehicle.
public net.minecraft.world.inventory.HorseInventoryMenu f_39654_ # horse
