# The forge/ island's Architectury Loom plugin declares a Java-21 runtime requirement in its metadata, so the
# launching JVM alone (CI installs the java_build_version JDK, 8) cannot configure the island build. This pins
# the island daemon to Java 21 by toolchain criteria, found by Gradle's installation detection (auto-download
# stays off); the mod bytecode target is unaffected, since the compile toolchain stays java_version (8). This
# mirrors the root build's own gradle/gradle-daemon-jvm.properties, which the island does not read.
toolchainVersion=21
