# This band's java_build_version is 16, so the island's Gradle daemon would launch on Java 16, but
# mod-publish-plugin declares a Java-17 runtime requirement in its metadata and would fail to resolve there. Pin
# the island daemon to Java 17, found by Gradle's installation detection; the mod bytecode target is unaffected,
# since the compile toolchain stays java_version (16). The other Forge-island bands run java_build_version 17 and
# need no such file.
toolchainVersion=17
