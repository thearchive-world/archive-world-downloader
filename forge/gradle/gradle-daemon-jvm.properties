# This band is forge-only with java_build_version 8, so the island daemon would launch on Java 8, but
# mod-publish-plugin declares a Java-17 runtime requirement in its metadata and would fail to resolve there.
# Pin the island daemon to Java 17, found by installation detection; the mod bytecode target is unaffected,
# since the compile toolchain stays java_version (8).
toolchainVersion=17
