# ForgeGradle 6 supports the Gradle 8.x series (its EnvironmentChecks reject only Gradle 9). This island runs
# 8.14.5, the top of that series and the Loom islands' version, so it also loads mod-publish-plugin (whose
# Kotlin metadata the older 8.1.1 embedded Kotlin cannot read) for release publishing. The band's Gradle-9 root
# (common + fabric) keeps its own 9.x wrapper.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.5-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
