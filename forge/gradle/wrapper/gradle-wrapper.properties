# Gradle 8.7 cannot run this island: me.modmuss50.mod-publish-plugin (see build.gradle.kts's plugins block) calls
# ConfigurableFileCollection.convention(Iterable), a Gradle API member 8.7 does not carry (its gradle-core-api jar
# exposes no convention() overload at all), so an 8.7 wrapper fails configuring publishMods with a
# NoSuchMethodError. 8.8 is the oldest 8.x that carries the method. The wrapper pins the newest 8.x line, matched
# by the root wrapper, so both wrappers in this band run one single Gradle version. This island pins the 8.x line
# rather than 9 because Unimined 1.4.x, which provisions Forge here, is untested there.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.5-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
