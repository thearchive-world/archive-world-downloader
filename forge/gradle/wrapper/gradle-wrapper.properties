# Gradle 8.7 cannot run this island: me.modmuss50.mod-publish-plugin calls
# ConfigurableFileCollection.convention(Iterable), a Gradle API member 8.7 does not carry, so an 8.7 wrapper fails
# configuring publishMods with a NoSuchMethodError. 8.8 is the oldest 8.x that carries the method.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.5-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
