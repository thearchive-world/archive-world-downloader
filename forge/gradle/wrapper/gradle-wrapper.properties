# Unimined 1.4.1, which this island uses to provision Forge 1.12.2, is spike-proven on Gradle 8.7 (the version
# Unimined's own 1.4.x samples pin), but me.modmuss50.mod-publish-plugin 2.2.0 (see build.gradle.kts's plugins
# block) calls ConfigurableFileCollection.convention(Iterable), a Gradle API member 8.7 does not carry (confirmed
# by javap against gradle-core-api-8.7.jar: the interface exposes no convention() overload at all), so a plain
# 8.7 wrapper fails configuring publishMods with a NoSuchMethodError, reproduced in isolation against every
# mod-publish-plugin release back to 2.0.1 on a minimal scratch project with no Unimined involved at all. 8.8 is
# the oldest 8.x that carries the method; pinned instead to 8.14.5, the newest 8.x line (this band's own
# pre-Unimined version, so its distribution is already proven reachable), verified end to end here (Unimined's
# FG3 provision + AT processing + searge/mcp remap + compileJava reaching the same seam-red outcome as 8.8, with
# no config or provision error) and matched by the root wrapper below, so both wrappers in this band run one
# single Gradle version. This island pins the 8.x line rather than 9 because Unimined 1.4.x is untested there.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.5-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
