# Architectury Loom 1.14.x targets the Gradle 8.x line; it also runs on Gradle 9 but rides Gradle-9-deprecated
# APIs there, so this island pins the latest 8.x, 8.14.5. The band's Gradle-9 root (common + fabric) keeps its
# own 9.x wrapper. This replaced ForgeGradle 6, which was hard-limited to Gradle 8 (its EnvironmentChecks reject
# Gradle 9); Loom carries no such limit, so the 8.x pin is now a choice, not a requirement.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.5-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
