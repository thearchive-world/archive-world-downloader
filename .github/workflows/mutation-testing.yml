name: Mutation testing (common)

# The ratcheted PITest gate: :common:pitest mutates the fidelity allowlist and fails below the
# mutationThreshold floor set in common/build.gradle.kts. It is deliberately separate from ci.yml (the fast
# source-merge / core-invariant / headless-unit gate) so it never slows that gate, mirroring
# capture-verification.yml. Each minion forks a JVM that boots the vanilla registries off the test runtime
# classpath, so this is heavier than the unit gate; the thread count (common/build.gradle.kts) defaults to a
# size the runner carries without oversubscribing. The floor is only raised as coverage grows, never lowered.
on:
  push:
    branches:
      - dev
      # Version branches too (three-part 1.21.11/26.1.2, two-part 26.2), so the ratchet guards every era band.
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+"
    # An exclusion, not an include list, and targetTests is the reason. It is world.thearchive.wdl.*Test, so
    # PIT runs every test in the module and aborts unless that baseline is green: anything any test READS is an
    # input to the score, not just the mutated classes. Three tests scan ../fabric and ../neoforge, six read
    # assets/wdl/lang, and between them they reach most of common/src/main. What is left below cannot move the
    # score, and an exclusion also fails in the safe direction: a new top-level directory starts running this
    # tier rather than silently ceasing to.
    paths-ignore:
      - '**/*.md'
      - '.github/**'
      - 'art/**'
      - 'config/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - 'LICENSE'
      - 'GPL-3.0.txt'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.github/**'
      - 'art/**'
      - 'config/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - 'LICENSE'
      - 'GPL-3.0.txt'
  # On demand, because .github/** is ignored above and editing this job therefore cannot trigger it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; a dev / version-branch run that has started is left to finish (a queued run can
  # still be superseded by a newer push).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Load-bearing: selects bash's documented template, bash --noprofile --norc -eo pipefail {0}. Without it a
# pipeline reports only its last command's status, so a failed gradle call can read as green behind a filter.
defaults:
  run:
    shell: bash

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    # PITest forks a JVM per minion that boots the vanilla registries, so a full run is minutes, not seconds.
    # Cap it generously so a legitimately slow but green run survives, while a hang still fails fast rather
    # than running to the 6h default.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the build JDK
        # setup-java cannot read a .properties file, so this branch's own coordinate is lifted here.
        id: jdk
        run: |
          version="$(sed -n 's/^java_build_version=//p' gradle.properties | tail -n1 | tr -d '[:space:]')"
          [ -n "$version" ] || { echo "no java_build_version=<jdk> line in gradle.properties" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up the build JDK (Temurin)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}

      - name: Set up Gradle
        # basic is the MIT caching provider. The v6 default routes caching through the proprietary
        # gradle-actions-caching library, whose terms every fork's CI would otherwise accept silently.
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          cache-provider: basic

      - name: Run the mutation-testing ratchet (:common:pitest)
        run: ./gradlew :common:pitest --stacktrace
