name: Mutation testing (common)

on:
  push:
    branches:
      - dev
      # Version branches too (three-part 1.21.11/26.1.2, two-part 26.2), so the ratchet guards every era band.
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+"
    # An exclusion, not an include list, and targetTests is the reason. It is world.thearchive.wdl.*Test, so PIT runs
    # every test in the module and aborts unless that baseline is green: anything any test READS is an input to the
    # score, not just the mutated classes. An exclusion also fails in the safe direction: a new top-level directory
    # starts running this tier rather than silently ceasing to.
    paths-ignore:
      - '**/*.md'
      - 'release-matrix.txt'
      - '.github/**'
      - 'art/**'
      - 'config/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - 'LICENSE'
      - 'GPL-3.0.txt'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'release-matrix.txt'
      - '.github/**'
      - 'art/**'
      - 'config/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - 'LICENSE'
      - 'GPL-3.0.txt'
  # On demand, because .github/** is ignored above and editing this job therefore cannot trigger it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    # Cap it generously so a legitimately slow but green run survives, while a hang still fails fast rather than running
    # to the 6h default.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the build JDK
        # setup-java cannot read a .properties file, so this branch's own coordinate is lifted here.
        id: jdk
        run: |
          version="$(sed -n 's/^java_build_version=//p' gradle.properties | tail -n1 | tr -d '[:space:]')"
          [ -n "$version" ] || { echo "no java_build_version=<jdk> line in gradle.properties" >&2; exit 1; }
          major="${version%%[!0-9]*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The language target's own JDK is installed alongside the toolchain's wherever the two differ, because
          # era-specific build tooling still asks for that one: ForgeGradle runs its MCP steps on the Minecraft
          # version's JDK whatever the project compiles with. 21 goes last where the build JDK is older so it takes the
          # default JAVA_HOME, and fabric-loom publishes org.gradle.jvm.version=21 that a daemon below it cannot resolve
          # at all.
          target="$(sed -n 's/^java_version=//p' gradle.properties | tr -d '[:space:]')"
          jdks="$version"
          if [ "$target" != "$major" ]; then jdks="$(printf '%s\n%s' "$jdks" "$target")"; fi
          if [ "$major" -lt 21 ]; then jdks="$(printf '%s\n21' "$jdks")"; fi
          printf 'jdks<<EOF\n%s\nEOF\n' "$jdks" >> "$GITHUB_OUTPUT"
          # One signature flag covers every install in that list, and Temurin 16 is end of life at 16.0.2+7 with
          # no detached signature ever published, so the check is waived whenever a 16 is among them, never
          # otherwise. Reading the finished list rather than one coordinate is what keeps the two in step.
          verify=true
          for j in $jdks; do case "$j" in 16 | 16.*) verify=false ;; esac; done
          echo "verify=$verify" >> "$GITHUB_OUTPUT"
          echo "GRADLE_OPTS=-Dorg.gradle.java.installations.fromEnv=JAVA_HOME_${major}_X64" >> "$GITHUB_ENV"

      - name: Set up the build JDKs (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          verify-signature: ${{ steps.jdk.outputs.verify }}
          java-version: ${{ steps.jdk.outputs.jdks }}

      - name: Set up Gradle
        # basic is the MIT caching provider. The v6 default routes caching through the proprietary
        # gradle-actions-caching library, whose terms every fork's CI would otherwise accept silently.
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          cache-provider: basic

      - name: Run the mutation-testing ratchet (:common:pitest)
        run: ./gradlew :common:pitest --stacktrace
