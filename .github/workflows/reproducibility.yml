name: Reproducibility

# Advisory (non-required) guard: builds the two production jars twice and fails on any SHA-256 mismatch,
# so a future plugin/dependency bump that breaks byte-reproducibility is caught per-commit. Same-machine,
# shared-warm-GRADLE_USER_HOME scope only (a strict subset of the third-party guarantee); the cold-cache /
# cross-image acceptance lives in the release process, not here. Kept off the fast ci.yml gate, like
# mutation-testing.yml / capture-verification.yml.
on:
  push:
    branches:
      - dev
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+"
    # The job builds one tree twice and diffs the jars, so a source change moves both halves identically and
    # only the build definition can break the property. An include list is therefore honest here in a way it is
    # not for the mutation tier: this job runs no tests, so nothing it reads is hidden behind a test glob.
    paths:
      - 'gradle/**'          # the wrapper's pinned Gradle version as much as the catalog
      - 'gradlew'            # sets DEFAULT_JVM_OPTS and picks the JVM; gradle/** and **/*.gradle.kts miss it
      - 'build-logic/**'
      - '**/*.gradle.kts'    # root, settings, build-logic and the three subprojects
      - 'gradle.properties'
      # This file too: the exact JDK patch is pinned below and is itself a determinism input, so a bump has to
      # re-baseline here rather than wait for someone to touch build-logic.
      - '.github/workflows/reproducibility.yml'
  pull_request:
    paths:
      - 'gradle/**'
      - 'gradlew'
      - 'build-logic/**'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/reproducibility.yml'
  # On demand: re-baselining after a Temurin patch bump or re-checking a tag needs no commit to carry it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Load-bearing: selects bash's documented template, bash --noprofile --norc -eo pipefail {0}. Without it a
# pipeline reports only its last command's status, so a failed gradle call can read as green behind a filter.
defaults:
  run:
    shell: bash

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    # Two full builds; the second reuses the warm GRADLE_USER_HOME Minecraft remap, so budget ~ cold-once
    # + assemble-twice rather than 2x a cold build.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the build JDK
        # setup-java cannot read a .properties file, so this branch's own coordinate is lifted here.
        id: jdk
        run: |
          version="$(sed -n 's/^java_build_version=//p' gradle.properties | tail -n1 | tr -d '[:space:]')"
          [ -n "$version" ] || { echo "no java_build_version=<jdk> line in gradle.properties" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up the build JDK (Temurin)
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92  # v6.2.0
        with:
          cache-disabled: true

      - name: Build, then rebuild clean, and byte-diff the two production jars
        run: |
          set -euo pipefail
          # Resolve the two authoritative jar paths deterministically: capture via command substitution, so
          # set -e catches a gradle failure (a process-substitution < <(...) would swallow its exit code);
          # filter to jar paths under build/libs (tolerating any stray -q line); and sort, so parallel
          # execution (org.gradle.parallel=true races the two subprojects' stdout) can't reorder the list and
          # false-fail the diff on byte-identical jars.
          hash_jars() {
            local out
            out="$(./gradlew -q :fabric:printProductionJar :neoforge:printProductionJar)"
            mapfile -t JARS < <(printf '%s\n' "$out" | grep -E '/build/libs/.*\.jar$' | sort)
            if [ "${#JARS[@]}" -ne 2 ]; then
              echo "::error::expected exactly 2 production jars, got ${#JARS[@]}"; printf '%s\n' "$out"; exit 1
            fi
            for j in "${JARS[@]}"; do
              [ -s "$j" ] || { echo "::error::production jar missing or empty: $j"; exit 1; }
            done
            sha256sum "${JARS[@]}" | awk '{print $1}'
          }
          ./gradlew assemble --no-build-cache
          hash_jars > run1.sha
          echo "run 1:"; cat run1.sha
          ./gradlew clean assemble --no-build-cache
          hash_jars > run2.sha
          echo "run 2:"; cat run2.sha
          if ! diff -u run1.sha run2.sha; then
            echo "::error::production jars are NOT byte-reproducible across two clean builds"; exit 1
          fi
          echo "reproducible: both builds produced byte-identical production jars"
