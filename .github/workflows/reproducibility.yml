name: Reproducibility

# Advisory (non-required) guard: builds every production jar twice and fails on any SHA-256 mismatch,
# so a future plugin/dependency bump that breaks byte-reproducibility is caught per-commit. Same-machine,
# shared-warm-GRADLE_USER_HOME scope only (a strict subset of the third-party guarantee); the cold-cache /
# cross-image acceptance lives in the release process, not here. Kept off the fast ci.yml gate, like
# mutation-testing.yml / capture-verification.yml.
on:
  push:
    branches:
      - dev
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+"
    # The job builds one tree twice and diffs the jars, so a source change moves both halves identically and
    # only the build definition can break the property. An include list is therefore honest here in a way it is
    # not for the mutation tier: this job runs no tests, so nothing it reads is hidden behind a test glob.
    paths:
      - 'gradle/**'          # the wrapper's pinned Gradle version as much as the catalog
      - 'gradlew'            # sets DEFAULT_JVM_OPTS and picks the JVM; gradle/** and **/*.gradle.kts miss it
      - 'build-logic/**'
      - '**/*.gradle.kts'    # root, settings, build-logic, the subprojects and the forge/ island's own two
      - 'gradle.properties'
      # The forge/ island is a separate build with its own wrapper and pinned Gradle version, each a determinism
      # input of the ship jar the island arm below diffs; the root patterns above stop at the root's copies.
      - 'forge/gradlew'
      - 'forge/gradle/**'
      - 'forge/gradle.properties'
      # This file too: the exact JDK patch is pinned below and is itself a determinism input, so a bump has to
      # re-baseline here rather than wait for someone to touch build-logic.
      - '.github/workflows/reproducibility.yml'
  pull_request:
    paths:
      - 'gradle/**'
      - 'gradlew'
      - 'build-logic/**'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'forge/gradlew'
      - 'forge/gradle/**'
      - 'forge/gradle.properties'
      - '.github/workflows/reproducibility.yml'
  # On demand: re-baselining after a Temurin patch bump or re-checking a tag needs no commit to carry it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Load-bearing: selects bash's documented template, bash --noprofile --norc -eo pipefail {0}. Without it a
# pipeline reports only its last command's status, so a failed gradle call can read as green behind a filter.
defaults:
  run:
    shell: bash

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    # Two full builds, plus two of the forge/ island where the band ships one; the second of each reuses the
    # warm GRADLE_USER_HOME Minecraft remap, so budget ~ cold-once + assemble-twice rather than 2x a cold build.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the build JDK
        # setup-java cannot read a .properties file, so this branch's own coordinate is lifted here.
        id: jdk
        run: |
          version="$(sed -n 's/^java_build_version=//p' gradle.properties | tail -n1 | tr -d '[:space:]')"
          [ -n "$version" ] || { echo "no java_build_version=<jdk> line in gradle.properties" >&2; exit 1; }
          major="${version%%[!0-9]*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The language target's own JDK is installed alongside the toolchain's wherever the two differ, because
          # era-specific build tooling still asks for that one: ForgeGradle runs its MCP steps on the Minecraft
          # version's JDK whatever the project compiles with. 21 goes last where the build JDK is older so it
          # takes the default JAVA_HOME, which is what launches the daemon, and fabric-loom publishes
          # org.gradle.jvm.version=21 that a daemon below it cannot resolve at all.
          target="$(sed -n 's/^java_version=//p' gradle.properties | tr -d '[:space:]')"
          jdks="$version"
          if [ "$target" != "$major" ]; then jdks="$(printf '%s\n%s' "$jdks" "$target")"; fi
          if [ "$major" -lt 21 ]; then jdks="$(printf '%s\n21' "$jdks")"; fi
          printf 'jdks<<EOF\n%s\nEOF\n' "$jdks" >> "$GITHUB_OUTPUT"
          # One signature flag covers every install in that list, and Temurin 16 is end of life at 16.0.2+7 with
          # no detached signature ever published, so the check is waived whenever a 16 is among them, never
          # otherwise. Reading the finished list rather than one coordinate is what keeps the two in step.
          verify=true
          for j in $jdks; do case "$j" in 16 | 16.*) verify=false ;; esac; done
          echo "verify=$verify" >> "$GITHUB_OUTPUT"
          # fabric-loom publishes org.gradle.jvm.version=21, so a daemon below 21 cannot resolve it
          # at all and the build dies while configuring the root project, which declares the plugin apply-false
          # even on a band that ships no Fabric module. A band whose own build JDK is older therefore installs
          # 21 beside it and lets 21 be the default JAVA_HOME, since that is what launches the daemon and
          # setup-java hands the default to the last entry of a multi-version list. The real build JDK is then
          # reached only through its JAVA_HOME_<major>_X64 variable and the fromEnv bridge below, a genuine
          # toolchain resolution rather than a same-JVM --release target. A warm dependency cache hides the
          # failure entirely, so it shows up only on a clean checkout.
          # Gradle auto-detects the installation JAVA_HOME names plus whatever
          # org.gradle.java.installations.fromEnv names, but nothing scans the GitHub Actions tool-cache paths
          # setup-java installs into, and auto-download stays off per gradle.properties, so without this bridge
          # there is nothing to fall back to. GRADLE_OPTS applies to every gradlew invocation in the job, so one
          # line covers the root build and any separate island wrapper alike.
          echo "GRADLE_OPTS=-Dorg.gradle.java.installations.fromEnv=JAVA_HOME_${major}_X64" >> "$GITHUB_ENV"

      - name: Set up the build JDKs (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          verify-signature: ${{ steps.jdk.outputs.verify }}
          java-version: ${{ steps.jdk.outputs.jdks }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          cache-disabled: true

      - name: Build, then rebuild clean, and byte-diff the production jars
        run: |
          set -euo pipefail
          # Loader-aware jar resolution. The root build's production jars come from the loader subprojects the
          # band includes: a fabric+neoforge band includes :fabric and :neoforge, a deep band includes :fabric alone
          # or neither, its Forge jar coming from the separate forge/ island build that the island arm below
          # covers. Read the loader set from settings.gradle.kts's include(...) statements -- matching the quoted
          # project name on an include line, so a comment naming a loader cannot false-positive -- and never
          # assert a :<loader>:printProductionJar for a project this band does not include.
          LOADER_TASKS=()
          for loader in fabric neoforge; do
            if grep -E '^[[:space:]]*include\(' settings.gradle.kts | grep -q "\"${loader}\""; then
              LOADER_TASKS+=(":${loader}:printProductionJar")
            fi
          done
          # The island arm is gated on the island existing, never on the loader set being empty: a band can carry
          # both a loader subproject and an island, and then both arms run. A band with neither has nothing to
          # compare, and a run that compares nothing must not read as a passing check.
          if [ -f forge/gradlew ]; then ISLAND=true; else ISLAND=false; fi
          if [ "${#LOADER_TASKS[@]}" -eq 0 ] && [ "$ISLAND" = false ]; then
            echo "::error::nothing to compare: settings.gradle.kts includes no :fabric/:neoforge and there is no forge/ island"
            exit 1
          fi
          # Run 1's jars do not survive the clean rebuild, so each run's jars are copied aside as they are hashed;
          # the step below uploads them when the run fails.
          keep_jars() {
            mkdir -p "repro-jars/$1"
            while read -r _ jar; do cp "$jar" "repro-jars/$1/"; done < "$1.sha"
          }
          if [ "${#LOADER_TASKS[@]}" -eq 0 ]; then
            echo "no loader subprojects on this band (settings.gradle.kts includes no :fabric/:neoforge), so the root"
            echo "build produces no production jar; the forge/ island's ship jar is compared below."
            # The island still builds on top of the root build, as it does in ci.yml and release.yml: an island can
            # configure against the root's outputs (the hand-rolled one reads the Minecraft classpath the root's
            # Loom resolved out of common/build), so the root is assembled once here even though it yields no jar
            # to compare.
            ./gradlew assemble --no-build-cache
          else
            # Resolve the authoritative jar paths deterministically: capture via command substitution, so set -e
            # catches a gradle failure (a process-substitution < <(...) would swallow its exit code); filter to jar
            # paths under build/libs (tolerating any stray -q line); and sort, so parallel execution
            # (org.gradle.parallel=true races the subprojects' stdout) can't reorder the list and false-fail the
            # diff on byte-identical jars.
            hash_jars() {
              local out
              out="$(./gradlew -q "${LOADER_TASKS[@]}")"
              mapfile -t JARS < <(printf '%s\n' "$out" | grep -E '/build/libs/.*\.jar$' | sort)
              if [ "${#JARS[@]}" -ne "${#LOADER_TASKS[@]}" ]; then
                echo "::error::expected ${#LOADER_TASKS[@]} production jars, got ${#JARS[@]}"; printf '%s\n' "$out"; exit 1
              fi
              for j in "${JARS[@]}"; do
                [ -s "$j" ] || { echo "::error::production jar missing or empty: $j"; exit 1; }
              done
              sha256sum "${JARS[@]}"
            }
            ./gradlew assemble --no-build-cache
            hash_jars > run1.sha
            echo "run 1:"; cat run1.sha
            keep_jars run1
            ./gradlew clean assemble --no-build-cache
            hash_jars > run2.sha
            echo "run 2:"; cat run2.sha
            keep_jars run2
            if ! diff -u run1.sha run2.sha; then
              echo "::error::production jars are NOT byte-reproducible across two clean builds: $(diff run1.sha run2.sha | sed -n 's/^> [0-9a-f]*  //p' | paste -sd ' ')"; exit 1
            fi
            echo "reproducible: both builds produced byte-identical production jars"
          fi
          if [ "$ISLAND" = true ]; then
            # The island exposes no printProductionJar, so its ship jar is selected the way release.yml selects it:
            # every jar under forge/build/libs except the sources and dev jars. Exactly one must remain, so an
            # intermediate landing beside the ship jar fails the run instead of being hashed in its place.
            hash_island_jar() {
              local jars=()
              for j in forge/build/libs/*.jar; do
                case "$j" in *-sources.jar | *-dev.jar) continue ;; esac
                [ -e "$j" ] && jars+=("$j")
              done
              if [ "${#jars[@]}" -ne 1 ]; then
                echo "::error::expected exactly 1 island ship jar under forge/build/libs, got ${#jars[@]}"; ls -l forge/build/libs || true; exit 1
              fi
              [ -s "${jars[0]}" ] || { echo "::error::island ship jar missing or empty: ${jars[0]}"; exit 1; }
              sha256sum "${jars[0]}"
            }
            (cd forge && ./gradlew assemble --no-build-cache)
            hash_island_jar > island1.sha
            echo "island run 1:"; cat island1.sha
            keep_jars island1
            (cd forge && ./gradlew clean assemble --no-build-cache)
            hash_island_jar > island2.sha
            echo "island run 2:"; cat island2.sha
            keep_jars island2
            if ! diff -u island1.sha island2.sha; then
              echo "::error::the forge/ island's ship jar is NOT byte-reproducible across two clean builds: $(awk '{print $2}' island1.sha)"; exit 1
            fi
            echo "reproducible: both island builds produced a byte-identical ship jar"
          fi

      # A mismatch is diagnosed from the run's own jars instead of a rebuild. A green run uploads nothing, and a run
      # that failed before a jar was hashed has nothing to upload either.
      - name: Upload both builds' jars
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: reproducibility-jars
          path: repro-jars/
          if-no-files-found: ignore
          retention-days: 7
