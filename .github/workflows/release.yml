name: Release (CurseForge, Modrinth, GitHub)

# Publishes one band of a coordinated release. The tag is the version core plus the MC build-metadata (e.g.
# 1.1.0+26.2), mirroring the jar name archive-wdl-<loader>-<mod_version>+<minecraft_version>.jar. The published
# version is read from gradle.properties, not from the tag, so the flow is bump-then-tag; the guard step below
# fails the run unless the pushed tag equals the built version, so a stale -SNAPSHOT cannot ship.
#
# Every band shares one product version, and the release is ONE GitHub release titled at the core (e.g. 1.1.0)
# carrying every band-times-loader jar. The publish plugin cannot build that release: its github block always
# creates a new release and 422s on an existing tag, and its parent() link is a same-build dependency, so it
# cannot reach a release another band's separate run created. So publishMods here does only CurseForge and
# Modrinth (per MC version, unchanged), and the funnel step below appends this band's jars to one shared DRAFT
# release with gh. The draft is created once beforehand by release-open, not here, so concurrent band runs never
# race to create duplicate drafts (GitHub does not enforce tag uniqueness for drafts).
#
# The release flow is: run release-open for the version, push the band tags a few at a time (GitHub creates no
# tag-push events past three tags in one push, which also staggers the not-atomic platform publishes band by
# band), then run release-finalize to verify the full matrix and publish the draft. A partial platform publish
# is retried by deleting that band's partial version(s) and re-pushing its tag. Nothing is public until finalize
# publishes the draft. PUBLISH_DRY_RUN=true validates the platform coordinates without uploading. Requires
# MODRINTH_TOKEN and CURSEFORGE_TOKEN in the release environment; the built-in GITHUB_TOKEN covers the draft.
on:
  push:
    tags:
      # Semver core + literal '+' + any MC build-metadata (1.21.11, 26.2, ...). The core gates this to a
      # real release tag; the metadata is left open so every MC band the release targets matches.
      - '[0-9]+.[0-9]+.[0-9]+\+*'

permissions:
  contents: write       # GitHub Release upload
  id-token: write       # mint the Sigstore OIDC token for attestation
  attestations: write   # persist the attestation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release once it has started (a partial publish is the messy state described above).
  cancel-in-progress: false

# Load-bearing: selects bash's documented template, bash --noprofile --norc -eo pipefail {0}. Without it a
# pipeline reports only its last command's status, so a failed gradle call can read as green behind a filter.
defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release  # a repository secret would be readable by everyone with write access
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the build JDK
        # setup-java cannot read a .properties file, so this branch's own coordinate is lifted here.
        id: jdk
        run: |
          version="$(sed -n 's/^java_build_version=//p' gradle.properties | tail -n1 | tr -d '[:space:]')"
          [ -n "$version" ] || { echo "no java_build_version=<jdk> line in gradle.properties" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up the build JDK (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}

      - name: Set up Gradle
        # basic is the MIT caching provider. The v6 default routes caching through the proprietary
        # gradle-actions-caching library, whose terms every fork's CI would otherwise accept silently.
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          cache-provider: basic

      # Fail fast unless the pushed tag equals the version the build will publish (mod_version + MC metadata).
      # Guards the bump-then-tag flow: a tag pushed before dropping -SNAPSHOT (or against the wrong MC pin)
      # stops here instead of publishing a mislabeled stable version and minting a divergent release tag.
      # The pushed tag flows through an env var, never inlined into the script by ${{ }} templating, so a
      # crafted tag name cannot inject shell into this job (which later holds the publish tokens).
      - name: "Guard: pushed tag must equal the built version"
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BUILT=$(./gradlew -q :fabric:printVersion | sed -n 's/^PROJECT_VERSION=//p')
          echo "pushed tag: ${REF_NAME}"
          echo "built version: ${BUILT}"
          if [ "${REF_NAME}" != "${BUILT}" ]; then
            echo "::error::Pushed tag '${REF_NAME}' != built version '${BUILT}'. Bump mod_version (drop -SNAPSHOT) and match the MC pin before tagging."
            exit 1
          fi

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Resolve authoritative production-jar paths
        id: jars
        run: |
          set -euo pipefail
          # Command substitution (not < <(...)) so set -e catches a gradle failure; filter to build/libs
          # jar paths (tolerating stray -q lines); sort for a stable order under parallel execution.
          out="$(./gradlew -q :fabric:printProductionJar :neoforge:printProductionJar)"
          mapfile -t JARS < <(printf '%s\n' "$out" | grep -E '/build/libs/.*\.jar$' | sort)
          if [ "${#JARS[@]}" -ne 2 ]; then
            echo "::error::expected exactly 2 production jars, got ${#JARS[@]}"; printf '%s\n' "$out"; exit 1
          fi
          for j in "${JARS[@]}"; do
            [ -s "$j" ] || { echo "::error::production jar missing or empty: $j"; exit 1; }
          done
          # Comma-delimited single line (actions/attest subject-path accepts commas), printf-joined so IFS
          # is never left changed. Sorted order puts fabric before neoforge.
          printf 'paths=%s,%s\n' "${JARS[0]}" "${JARS[1]}" >> "$GITHUB_OUTPUT"

      # The reproducibility record is a per-band asset file, not an edit to the shared release body, so the
      # concurrent per-band runs never race on a read-modify-write of the notes.
      - name: Build reproducibility record
        id: repro
        env:
          PATHS: ${{ steps.jars.outputs.paths }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          JDK="$(./gradlew -q :fabric:printCompileJavaVersion | grep -E '\(Java [0-9]+\)$' | tail -n1)"
          JDK_MAJOR="$(printf '%s' "$JDK" | sed -n 's/.*(Java \([0-9]\+\)).*/\1/p')"
          EXPECT="$(sed -n 's/^java_version=//p' gradle.properties | tr -d '[:space:]')"
          if [ "$JDK_MAJOR" != "$EXPECT" ]; then
            echo "::error::compile toolchain Java $JDK_MAJOR != java_version $EXPECT"; exit 1
          fi
          IFS=',' read -r FAB NEO <<< "$PATHS"
          FAB_SHA="$(sha256sum "$FAB" | awk '{print $1}')"
          NEO_SHA="$(sha256sum "$NEO" | awk '{print $1}')"
          RECORD="reproducibility-${VERSION}.txt"
          {
            echo "### Reproducibility record: ${VERSION}"
            echo "- Build JDK (compile toolchain): ${JDK}"
            echo "- Reference OS: ${{ runner.os }} (${{ runner.arch }}), GitHub-hosted ubuntu-latest"
            echo "- $(basename "$FAB") SHA-256: ${FAB_SHA}"
            echo "- $(basename "$NEO") SHA-256: ${NEO_SHA}"
          } > "$RECORD"
          echo "file=${RECORD}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ steps.jars.outputs.paths }}

      # The notes are the authored changelog section for this version, plus this band's reproducibility record
      # for the platforms; a missing section fails the run. PUBLISH_DRY_RUN=true validates the platform
      # coordinates without uploading. The plugin no longer publishes to GitHub; the funnel step does.
      - name: Publish to CurseForge and Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          VERSION: ${{ github.ref_name }}
          RECORD: ${{ steps.repro.outputs.file }}
        run: |
          set -euo pipefail
          CORE="${VERSION%%+*}"
          NOTES="$(awk -v v="$CORE" '/^##[[:space:]]/ { if (inblk) exit; inblk = ($2 == v); next } inblk { print }' CHANGELOG.md)"
          if [ -z "${NOTES//[[:space:]]/}" ]; then
            echo "::error::no CHANGELOG.md section headed '## ${CORE}'; add the release notes before tagging"; exit 1
          fi
          CHANGELOG="$(printf '%s\n\n%s\n' "$NOTES" "$(cat "$RECORD")")"
          export CHANGELOG
          ./gradlew publishMods

      # Append this band's jars and record to the shared draft release that release-open created for this
      # version. Release assets are independent of the tagged commit, so one release carries jars from many
      # separate runs; --clobber makes a re-push idempotent. This step only appends, never creates, so there is
      # no draft to race over. Not gated on PUBLISH_DRY_RUN: a draft is invisible and deletable, safe even in a
      # dry run, while the irreversible platform uploads are what dry-run protects.
      - name: Append this band's artifacts to the shared draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          PATHS: ${{ steps.jars.outputs.paths }}
          RECORD: ${{ steps.repro.outputs.file }}
        run: |
          set -euo pipefail
          CORE="${VERSION%%+*}"
          if ! gh release view "$CORE" >/dev/null 2>&1; then
            echo "::error::draft release '$CORE' does not exist; run the Release open workflow for $CORE before pushing band tags"; exit 1
          fi
          IFS=',' read -r FAB NEO <<< "$PATHS"
          gh release upload "$CORE" "$FAB" "$NEO" "$RECORD" --clobber
