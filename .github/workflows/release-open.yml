name: Release open (create the draft)

# Centralizing draft creation here is what lets the per-band runs only append and never create: GitHub does not enforce
# tag uniqueness for drafts, so two concurrent first-band creates would each make a duplicate draft and later uploads
# would scatter across them.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Product version core to open a draft for (e.g. 1.1.0). No +<mc>."
        required: true
        type: string

permissions:
  contents: write   # create the draft release

concurrency:
  group: release-open-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # --target pins the umbrella tag to the commit this workflow runs on if GitHub creates it at publish.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version '$VERSION' is not an X.Y.Z core"; exit 1 ;;
          esac
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release '$VERSION' already exists; nothing to open."
            exit 0
          fi
          gh release create "$VERSION" --draft --title "$VERSION" \
            --notes "Coordinated $VERSION release. Draft: bands append their artifacts; release-finalize publishes once the matrix is complete." \
            --target "$GITHUB_SHA"
          echo "opened draft release '$VERSION'."
