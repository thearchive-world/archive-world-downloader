name: Capture verification (Fabric)

# The automated capture-verification tier: a real headless Fabric client drives WDL's capture against a
# version-pinned fixture world and asserts the on-disk save. It is deliberately separate from ci.yml (the fast
# source-merge / core-invariant / headless-unit gate) so it never slows that gate or changes its required
# status. Requiring this tier would deadlock a documentation-only pull request: a workflow the paths-ignore
# filters above skip leaves its check pending rather than passing, and a pending required check blocks the
# merge. The client runs under a virtual framebuffer (xvfb-run), a real GL context with no display.
on:
  push:
    branches:
      - dev
      # Run the tier on every era-band branch too (three-part 1.21.11/26.1.2, two-part 26.2), not dev alone,
      # so a push to a version branch still exercises the headless capture. PRs run it regardless.
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+"
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; on a dev / version-branch push a run that has started is left to finish so this
  # tier keeps a per-commit status (a queued-but-not-started run can still be superseded by a newer push).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Load-bearing: selects bash's documented template, bash --noprofile --norc -eo pipefail {0}. Without it a
# pipeline reports only its last command's status, so a failed gradle call can read as green behind a filter.
defaults:
  run:
    shell: bash

jobs:
  capture-verification:
    runs-on: ubuntu-latest
    # The local run boots the client and works through the scenarios in a few minutes, but a hosted runner
    # has no warm Gradle or Loom cache and renders through software OpenGL, so the first run pays a cold
    # setup. Budget generously rather than risk killing a legitimately slow but green run; without a cap a
    # hung headless client would run to the 6h default.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # A band whose Minecraft version predates fabric-client-gametest-api-v1 (first shipped at 1.21.4) sets
      # client_gametest=false, and fabric/build.gradle.kts then leaves runClientGameTest unregistered. Resolve
      # the same flag here so the tier skips cleanly on those bands instead of invoking a task that does not
      # exist; an absent key defaults to enabled, so every 1.21.4-and-later band runs the tier unchanged.
      - name: Resolve whether this band registers the client gametest tier
        id: tier
        run: |
          enabled="$(sed -n 's/^client_gametest=//p' gradle.properties | tail -n1 | tr -d '[:space:]')"
          echo "enabled=${enabled:-true}" >> "$GITHUB_OUTPUT"

      - name: Resolve the build JDK
        # setup-java cannot read a .properties file, so this branch's own coordinate is lifted here.
        id: jdk
        if: steps.tier.outputs.enabled == 'true'
        run: |
          version="$(sed -n 's/^java_build_version=//p' gradle.properties | tail -n1 | tr -d '[:space:]')"
          [ -n "$version" ] || { echo "no java_build_version=<jdk> line in gradle.properties" >&2; exit 1; }
          major="${version%%[!0-9]*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The language target's own JDK is installed alongside the toolchain's wherever the two differ, because
          # era-specific build tooling still asks for that one: ForgeGradle runs its MCP steps on the Minecraft
          # version's JDK whatever the project compiles with. 21 goes last where the build JDK is older so it
          # takes the default JAVA_HOME, which is what launches the daemon, and fabric-loom 1.17.19 publishes
          # org.gradle.jvm.version=21 that a daemon below it cannot resolve at all.
          target="$(sed -n 's/^java_version=//p' gradle.properties | tr -d '[:space:]')"
          jdks="$version"
          if [ "$target" != "$major" ]; then jdks="$(printf '%s\n%s' "$jdks" "$target")"; fi
          if [ "$major" -lt 21 ]; then jdks="$(printf '%s\n21' "$jdks")"; fi
          printf 'jdks<<EOF\n%s\nEOF\n' "$jdks" >> "$GITHUB_OUTPUT"
          # One signature flag covers every install in that list, and Temurin 16 is end of life at 16.0.2+7 with
          # no detached signature ever published, so the check is waived whenever a 16 is among them, never
          # otherwise. Reading the finished list rather than one coordinate is what keeps the two in step.
          verify=true
          for j in $jdks; do case "$j" in 16 | 16.*) verify=false ;; esac; done
          echo "verify=$verify" >> "$GITHUB_OUTPUT"
          # fabric-loom 1.17.19 publishes org.gradle.jvm.version=21, so a daemon below 21 cannot resolve it
          # at all and the build dies while configuring the root project, which declares the plugin apply-false
          # even on a band that ships no Fabric module. A band whose own build JDK is older therefore installs
          # 21 beside it and lets 21 be the default JAVA_HOME, since that is what launches the daemon and
          # setup-java hands the default to the last entry of a multi-version list. The real build JDK is then
          # reached only through its JAVA_HOME_<major>_X64 variable and the fromEnv bridge below, a genuine
          # toolchain resolution rather than a same-JVM --release target. A warm dependency cache hides the
          # failure entirely, so it shows up only on a clean checkout.
          # Gradle auto-detects the installation JAVA_HOME names plus whatever
          # org.gradle.java.installations.fromEnv names, but nothing scans the GitHub Actions tool-cache paths
          # setup-java installs into, and auto-download stays off per gradle.properties, so without this bridge
          # there is nothing to fall back to. GRADLE_OPTS applies to every gradlew invocation in the job, so one
          # line covers the root build and any separate island wrapper alike.
          echo "GRADLE_OPTS=-Dorg.gradle.java.installations.fromEnv=JAVA_HOME_${major}_X64" >> "$GITHUB_ENV"

      - name: Set up the build JDKs (Temurin)
        if: steps.tier.outputs.enabled == 'true'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          verify-signature: ${{ steps.jdk.outputs.verify }}
          java-version: ${{ steps.jdk.outputs.jdks }}

      - name: Set up Gradle
        # basic is the MIT caching provider. The v6 default routes caching through the proprietary
        # gradle-actions-caching library, whose terms every fork's CI would otherwise accept silently.
        if: steps.tier.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          cache-provider: basic

      # xvfb supplies the virtual framebuffer; libgl1-mesa-dri supplies the llvmpipe software rasterizer the
      # client's GL context needs on a runner with no GPU (it is usually preinstalled, but pin it explicitly).
      - name: Install Xvfb + software OpenGL (virtual framebuffer for the headless client)
        if: steps.tier.outputs.enabled == 'true'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri

      # LIBGL_ALWAYS_SOFTWARE pins mesa to llvmpipe so GL never tries a (nonexistent) GPU. --no-configuration-cache
      # is required because the Loom run task reads a stale argFile under the configuration cache (enabled in
      # gradle.properties), which fails on cache reuse.
      - name: Run the Fabric capture-verification tier (headless client)
        if: steps.tier.outputs.enabled == 'true'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a ./gradlew :fabric:runClientGameTest --no-configuration-cache --stacktrace

      # The gametest framework writes a screenshot only when a scenario fails, so this artifact is empty on a
      # green run and carries the failing frame otherwise. if-no-files-found: ignore keeps a green run (and a
      # future run-dir path change) from failing the step; it is post-mortem only.
      - name: Upload gametest screenshots
        if: ${{ failure() && steps.tier.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: capture-verification-screenshots
          path: fabric/build/run/clientGameTest/screenshots
          if-no-files-found: ignore
