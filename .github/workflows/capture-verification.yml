name: Capture verification (Fabric)

# Requiring this tier would deadlock a documentation-only pull request: a workflow the paths-ignore filters skip leaves
# its check pending rather than passing, and a pending required check blocks the merge.
on:
  push:
    branches:
      - dev
      # Run the tier on every era-band branch too (three-part 1.21.11/26.1.2, two-part 26.2), not dev alone.
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+"
    paths-ignore:
      - '**/*.md'
      - 'release-matrix.txt'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'release-matrix.txt'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  capture-verification:
    runs-on: ubuntu-latest
    # Budget generously rather than risk killing a legitimately slow but green run; without a cap a hung headless client
    # would run to the 6h default.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # A band whose Minecraft version predates fabric-client-gametest-api-v1 (first shipped at 1.21.4) sets
      # client_gametest=false. Resolve the same flag here so the tier skips cleanly on those bands instead of invoking a
      # task that does not exist; an absent key defaults to enabled, so every 1.21.4-and-later band runs the tier
      # unchanged.
      - name: Resolve whether this band registers the client gametest tier
        id: tier
        run: |
          enabled="$(sed -n 's/^client_gametest=//p' gradle.properties | tail -n1 | tr -d '[:space:]')"
          echo "enabled=${enabled:-true}" >> "$GITHUB_OUTPUT"

      - name: Resolve the build JDK
        # setup-java cannot read a .properties file, so this branch's own coordinate is lifted here.
        id: jdk
        if: steps.tier.outputs.enabled == 'true'
        run: |
          version="$(sed -n 's/^java_build_version=//p' gradle.properties | tail -n1 | tr -d '[:space:]')"
          [ -n "$version" ] || { echo "no java_build_version=<jdk> line in gradle.properties" >&2; exit 1; }
          major="${version%%[!0-9]*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The language target's own JDK is installed alongside the toolchain's wherever the two differ, because
          # era-specific build tooling still asks for that one: ForgeGradle runs its MCP steps on the Minecraft
          # version's JDK whatever the project compiles with. 21 goes last where the build JDK is older so it takes the
          # default JAVA_HOME, and fabric-loom publishes org.gradle.jvm.version=21 that a daemon below it cannot resolve
          # at all.
          target="$(sed -n 's/^java_version=//p' gradle.properties | tr -d '[:space:]')"
          jdks="$version"
          if [ "$target" != "$major" ]; then jdks="$(printf '%s\n%s' "$jdks" "$target")"; fi
          if [ "$major" -lt 21 ]; then jdks="$(printf '%s\n21' "$jdks")"; fi
          printf 'jdks<<EOF\n%s\nEOF\n' "$jdks" >> "$GITHUB_OUTPUT"
          # One signature flag covers every install in that list, and Temurin 16 is end of life at 16.0.2+7 with
          # no detached signature ever published, so the check is waived whenever a 16 is among them, never
          # otherwise. Reading the finished list rather than one coordinate is what keeps the two in step.
          verify=true
          for j in $jdks; do case "$j" in 16 | 16.*) verify=false ;; esac; done
          echo "verify=$verify" >> "$GITHUB_OUTPUT"
          echo "GRADLE_OPTS=-Dorg.gradle.java.installations.fromEnv=JAVA_HOME_${major}_X64" >> "$GITHUB_ENV"

      - name: Set up the build JDKs (Temurin)
        if: steps.tier.outputs.enabled == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          verify-signature: ${{ steps.jdk.outputs.verify }}
          java-version: ${{ steps.jdk.outputs.jdks }}

      - name: Set up Gradle
        # basic is the MIT caching provider. The v6 default routes caching through the proprietary
        # gradle-actions-caching library, whose terms every fork's CI would otherwise accept silently.
        if: steps.tier.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          cache-provider: basic

      # xvfb supplies the virtual framebuffer; libgl1-mesa-dri supplies the llvmpipe software rasterizer behind a
      # GL context and mesa-vulkan-drivers the same rasterizer behind a Vulkan device, so a client that finds no
      # GLX visual under Xvfb and falls back to Vulkan still gets a device. Without the Vulkan driver that client
      # hangs on the missing backend until the job's timeout cancels it.
      - name: Install Xvfb + software OpenGL and Vulkan (virtual framebuffer for the headless client)
        if: steps.tier.outputs.enabled == 'true'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers

      # --no-configuration-cache is required because the Loom run task reads a stale argFile under the configuration
      # cache, which fails on cache reuse.
      - name: Run the Fabric capture-verification tier (headless client)
        if: steps.tier.outputs.enabled == 'true'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a ./gradlew :fabric:runClientGameTest --no-configuration-cache --stacktrace

      - name: Upload gametest screenshots
        if: ${{ failure() && steps.tier.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: capture-verification-screenshots
          path: fabric/build/run/clientGameTest/screenshots
          if-no-files-found: ignore
