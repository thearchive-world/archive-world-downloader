name: CI

# Build every era-band branch + PR, on the JDK that branch's gradle.properties names. ./gradlew build
# continuously guards the source-merge gate (:fabric:build -> remap common to intermediary) plus the core
# invariants (:common:check -> checkCoreImports, checkPlugBand, checkCoreJava8, checkJavaVersion) and the
# headless unit suite (:common:test).
on:
  push:
    branches:
      - dev
      # Era-band branches self-name from their MC version. Match both shapes so a push to any version
      # branch runs the gate, not just the 1.21.x line: three-part (1.21.11, 1.21.4, 26.1.2) and
      # two-part (26.2). A "1.21.*" style filter would skip the 26.x bands entirely.
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+"
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs only for PRs, where only the latest push matters. On push to dev or a version
  # branch a run is not canceled once it is in progress, so a commit that has started building finishes and
  # keeps its own status. (A run still pending in the queue can be superseded by a newer push, so this
  # reduces, not eliminates, bisect gaps on rapid back-to-back pushes.)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Load-bearing: selects bash's documented template, bash --noprofile --norc -eo pipefail {0}. Without it a
# pipeline reports only its last command's status, so a failed gradle call can read as green behind a filter.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    # The gate is a few minutes warm, but the first run on a fresh branch pays a cold Loom + ModDev setup
    # (download + remap Minecraft). Budget generously; the cap only exists to kill a hung run rather than
    # letting it ride to the 6h default.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Don't leave the job's GITHUB_TOKEN in .git/config where a later step or a build dependency
          # could read it; nothing in this workflow pushes back to the repo.
          persist-credentials: false

      - name: Resolve the build JDK
        # setup-java cannot read a .properties file, so this branch's own coordinate is lifted here.
        id: jdk
        run: |
          version="$(sed -n 's/^java_build_version=//p' gradle.properties | tail -n1 | tr -d '[:space:]')"
          [ -n "$version" ] || { echo "no java_build_version=<jdk> line in gradle.properties" >&2; exit 1; }
          major="${version%%[!0-9]*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The language target's own JDK is installed alongside the toolchain's wherever the two differ, because
          # era-specific build tooling still asks for that one: ForgeGradle runs its MCP steps on the Minecraft
          # version's JDK whatever the project compiles with. 21 goes last where the build JDK is older so it
          # takes the default JAVA_HOME, which is what launches the daemon, and fabric-loom 1.17.19 publishes
          # org.gradle.jvm.version=21 that a daemon below it cannot resolve at all.
          target="$(sed -n 's/^java_version=//p' gradle.properties | tr -d '[:space:]')"
          jdks="$version"
          if [ "$target" != "$major" ]; then jdks="$(printf '%s\n%s' "$jdks" "$target")"; fi
          if [ "$major" -lt 21 ]; then jdks="$(printf '%s\n21' "$jdks")"; fi
          printf 'jdks<<EOF\n%s\nEOF\n' "$jdks" >> "$GITHUB_OUTPUT"
          # One signature flag covers every install in that list, and Temurin 16 is end of life at 16.0.2+7 with
          # no detached signature ever published, so the check is waived whenever a 16 is among them, never
          # otherwise. Reading the finished list rather than one coordinate is what keeps the two in step.
          verify=true
          for j in $jdks; do case "$j" in 16 | 16.*) verify=false ;; esac; done
          echo "verify=$verify" >> "$GITHUB_OUTPUT"
          # fabric-loom 1.17.19 publishes org.gradle.jvm.version=21, so a daemon below 21 cannot resolve it
          # at all and the build dies while configuring the root project, which declares the plugin apply-false
          # even on a band that ships no Fabric module. A band whose own build JDK is older therefore installs
          # 21 beside it and lets 21 be the default JAVA_HOME, since that is what launches the daemon and
          # setup-java hands the default to the last entry of a multi-version list. The real build JDK is then
          # reached only through its JAVA_HOME_<major>_X64 variable and the fromEnv bridge below, a genuine
          # toolchain resolution rather than a same-JVM --release target. A warm dependency cache hides the
          # failure entirely, so it shows up only on a clean checkout.
          # Gradle auto-detects the installation JAVA_HOME names plus whatever
          # org.gradle.java.installations.fromEnv names, but nothing scans the GitHub Actions tool-cache paths
          # setup-java installs into, and auto-download stays off per gradle.properties, so without this bridge
          # there is nothing to fall back to. GRADLE_OPTS applies to every gradlew invocation in the job, so one
          # line covers the root build and any separate island wrapper alike.
          echo "GRADLE_OPTS=-Dorg.gradle.java.installations.fromEnv=JAVA_HOME_${major}_X64" >> "$GITHUB_ENV"

      - name: Set up the build JDKs (Temurin)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          verify-signature: ${{ steps.jdk.outputs.verify }}
          java-version: ${{ steps.jdk.outputs.jdks }}

      - name: Set up Gradle
        # basic is the MIT caching provider. The v6 default routes caching through the proprietary
        # gradle-actions-caching library, whose terms every fork's CI would otherwise accept silently.
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          cache-provider: basic

      - name: Build (source-merge gate) + core invariant + headless suite
        run: ./gradlew build --stacktrace

      # Convenience: grab the built jars off a green run without a local build. The real distribution is the
      # release workflow's publishMods, not these. Exclude the sources / dev jars Loom and ModDev also drop
      # into libs/ so the artifact carries only the production jar.
      - name: Upload Fabric artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: archive-wdl-fabric
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-dev.jar
          if-no-files-found: error

      - name: Upload NeoForge artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: archive-wdl-neoforge
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
          if-no-files-found: error
