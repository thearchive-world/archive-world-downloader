name: Release finalize (verify matrix, publish)

# Turns the shared DRAFT GitHub release into a published one, run by the maintainer once every band's
# release.yml run is green. It reads the declared matrix in release-matrix.txt, fails if any band-times-loader
# jar is missing from the draft, sets the authored changelog section as the body, and publishes. Publishing
# the draft is the only moment the release goes public and fires a release event, so an announcement webhook
# fires once for the whole matrix. No publish secrets are needed, and CurseForge and Modrinth are untouched.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Product version core to finalize (the release tag, e.g. 1.1.0). No +<mc>."
        required: true
        type: string

permissions:
  contents: write   # publish the GitHub release (draft -> published) and edit its notes

concurrency:
  group: release-finalize-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  finalize:
    runs-on: ubuntu-latest
    # The announcement webhook is an environment secret rather than a repository one, which every collaborator
    # with write access could read. It sits in its own environment instead of beside the publishing tokens: those
    # are gated to release tags, and widening that gate to reach a branch-dispatched job would hand the platform
    # credentials to anything running from a branch. This environment is gated to dev, which is the ref this
    # workflow is dispatched on, and holds nothing but the webhook.
    environment: announce
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # release-matrix.txt is the declared source of truth for the shipped band set, not inferred from the tags
      # or branches that exist, because a forgotten band would silently shrink the expected set and pass an
      # incomplete release. Loaders are read per band, so a later third loader is one manifest line, no logic
      # change.
      - name: Verify the release carries the full matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [ -f release-matrix.txt ] || { echo "::error::release-matrix.txt not found on this ref"; exit 1; }
          expected=()
          while read -r mc loaders; do
            [ -n "$mc" ] || continue
            loaders="${loaders// /}"
            [ -n "$loaders" ] || { echo "::error::release-matrix.txt line for band '$mc' has no loader column"; exit 1; }
            IFS=',' read -ra ls <<< "$loaders"
            for l in "${ls[@]}"; do
              expected+=("archive-wdl-${l}-${VERSION}+${mc}.jar")
            done
          done < <(grep -vE '^[[:space:]]*(#|$)' release-matrix.txt)
          if [ "${#expected[@]}" -eq 0 ]; then
            echo "::error::release-matrix.txt declared no band-times-loader entries"; exit 1
          fi
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::release '$VERSION' not found; run the Release open workflow and the band runs first"; exit 1
          fi
          mapfile -t present < <(gh release view "$VERSION" --json assets --jq '.assets[].name')
          missing=()
          for e in "${expected[@]}"; do
            printf '%s\n' "${present[@]}" | grep -qxF -- "$e" || missing+=("$e")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::missing band-times-loader jar: %s\n' "${missing[@]}"
            echo "Release '$VERSION' is incomplete: ${#missing[@]} of ${#expected[@]} expected jars missing. Not publishing." >&2
            exit 1
          fi
          echo "matrix complete: all ${#expected[@]} expected jars present in release '$VERSION'."

      # The body is the authored changelog section for this version (a missing section fails here). draft=false
      # is the single moment the release goes public and fires a release event.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          NOTES="$(awk -v v="$VERSION" '/^##[[:space:]]/ { if (inblk) exit; inblk = ($2 == v); next } inblk { print }' CHANGELOG.md)"
          if [ -z "${NOTES//[[:space:]]/}" ]; then
            echo "::error::no CHANGELOG.md section headed '## ${VERSION}'; add the release notes before finalizing"; exit 1
          fi
          gh release edit "$VERSION" --notes "$NOTES"
          gh release edit "$VERSION" --draft=false
          echo "published release '$VERSION'."

      # GitHub's Discord integration carries no release body, only a fixed compact embed of the tag and a link,
      # so the announcement is sent from here instead, out of the same changelog section the release body uses.
      # It runs after the publish so a failed announcement cannot leave a release unpublished, and it no-ops
      # without the secret, so a fork or a mirror announces nothing until one is configured.
      - name: Announce the release on Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "no DISCORD_WEBHOOK secret configured; skipping the announcement."
            exit 0
          fi
          NOTES="$(awk -v v="$VERSION" '/^##[[:space:]]/ { if (inblk) exit; inblk = ($2 == v); next } inblk { print }' CHANGELOG.md)"
          # Where to get it, appended below the notes. These are store fronts rather than release-specific links,
          # so they are constant here rather than derived. The Modrinth line states the listing is still in
          # review and is the one line to change when it clears.
          LINKS="$(printf '%s\n' "" "**Get it**" \
            "- CurseForge: <https://www.curseforge.com/minecraft/mc-mods/wdl>" \
            "- GitHub Releases: <https://github.com/thearchive-world/archive-world-downloader/releases>" \
            "- Modrinth: coming once review clears")"
          # Discord caps an embed description at 4096 characters. Trim the notes, never the links: the release is
          # already published by this point, and a truncated announcement beats a red finalize.
          NOTES="$(printf '%s' "$NOTES" | head -c 3400)"
          NOTES="$(printf '%s\n%s' "$NOTES" "$LINKS")"
          # No username or avatar_url: those override the webhook's own identity, which is configured in Discord
          # where the name and icon belong. The payload carries only the announcement itself.
          jq -n --arg t "Archive World Downloader $VERSION" \
                --arg d "$NOTES" \
                --arg u "https://github.com/$REPO/releases/tag/$VERSION" \
                '{embeds:[{title:$t,url:$u,description:$d,color:3066993}]}' > discord.json
          curl -sS -f -X POST -H "Content-Type: application/json" -d @discord.json "$DISCORD_WEBHOOK"
          echo "announced $VERSION on Discord."
