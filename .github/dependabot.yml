# This file is read only from the repository's default branch, which is dev. The copy a version branch carries is
# therefore inert.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle-tooling:
        patterns:
          - "*"
    ignore:
      # JUnit stays on the 5.x line: 6.x raises the baseline to Java 17, which the Java 8 bands cannot meet. Allow 5.x
      # minor+patch and suppress the 6.x major.
      - dependency-name: "org.junit:junit-bom"
        update-types: ["version-update:semver-major"]
      # Modrinth-hosted soft-dependencies (XaeroPlus, ModMenu): XaeroPlus tags each band with a +<loader>-<mc> SemVer
      # build-metadata suffix. An automated bump would cross bands.
      - dependency-name: "maven.modrinth:*"
      # JourneyMap API: the version embeds the MC version, so an automated bump would cross bands.
      - dependency-name: "info.journeymap:*"
      # Fabric loader + API: the API version embeds +<mc>.
      - dependency-name: "net.fabricmc:*"
      - dependency-name: "net.fabricmc.fabric-api:*"
      # Parchment mappings: the artifact name embeds the MC version and the version is a dated mappings stamp,
      # neither of which Dependabot can bump coherently.
      - dependency-name: "org.parchmentmc.data:*"
      # On dev, minecraft-dependencies declares org.jspecify:jspecify:{strictly <version>}, which overrides the catalog
      # entry. That entry is a floor, not the resolved version, so a bump PR here can only fail resolution.
      - dependency-name: "org.jspecify:jspecify"
