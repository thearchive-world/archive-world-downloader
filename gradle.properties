org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.java.installations.auto-download=false
minecraft_version=1.13.2
# This band's parent in the mint chain: checkBandDivergence diffs the tree against its tip and against dev.
mint_parent=1.14.4
java_version=8
# The exact JDK the CI workflows install, distinct from java_version above: that one is a language version and carries
# no patch, while a byte-reproducible release jar needs the patch pinned.
java_build_version=8.0.504
# Doclint's reference check (the javadoc task) is part of check on this band: a dangling javadoc reference fails the
# build.
javadoc_gate=true
# This band drops :fabric from the root build entirely (Forge-only, below the Mojmap floor), so there is no
# fabric/build.gradle.kts left to read this key. It is kept here anyway, rather than removed, because an absent
# key defaults to true in capture-verification.yml, which would then try to run the now-nonexistent
# :fabric:runClientGameTest task; keeping it false makes that workflow green-skip with no workflow edit.
client_gametest=false

# forge_version_min is the runtime floor written into mods.toml, deliberately distinct from the build coordinate.
forge_version=1.13.2-25.0.223
forge_version_min=25.0.0

journeymap_api_coordinate=1.14.4-1.5
mod_id=wdl
mod_group=world.thearchive.wdl
mod_archives_base=archive-wdl
mod_version=1.3.0

