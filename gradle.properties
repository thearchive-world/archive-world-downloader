org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.java.installations.auto-download=false
minecraft_version=1.17.1
# This band's parent in the mint chain: checkBandDivergence diffs the tree against its tip and against dev.
mint_parent=1.18.2
parchment_minecraft_version=1.17.1
parchment_mappings_version=2021.12.12
java_version=16
# The JDK that compiles, deliberately not the language target above: javac 16 assigns local variable slots
# non-deterministically, so two clean builds of this band produced different jars.
java_toolchain_version=17
# The exact JDK the CI workflows install, distinct from both versions above: those carry no patch, while a
# byte-reproducible release jar needs the patch pinned.
java_build_version=17.0.20
# Doclint's reference check (the javadoc task) is part of check on this band: a dangling javadoc reference fails the
# build.
javadoc_gate=true
fabric_loader_version=0.19.5
# Runtime floor, deliberately distinct from the build coordinate above.
fabric_loader_version_min=0.12.12
fabric_api_version=0.46.1+1.17
# This Minecraft version predates the Fabric client game test framework (fabric-client-gametest-api-v1, first shipped at
# 1.21.4), so fabric/build.gradle.kts disables the capture-verification gametest tier on this band.
client_gametest=false

# forge_version_min is the runtime floor written into mods.toml, deliberately distinct from the build coordinate.
forge_version=1.17.1-37.1.1
forge_version_min=37.0.0

modmenu_version=2.0.17
journeymap_api_coordinate=1.17.1-1.8
mod_id=wdl
mod_group=world.thearchive.wdl
mod_archives_base=archive-wdl
mod_version=1.3.0

modrinth_id=x6JOJ1sf
curseforge_id=1554389
