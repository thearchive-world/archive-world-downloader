org.gradle.jvmargs=-Xmx3G
# Parallel project execution and the local build cache, both safe on a three-module build.
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache: OFF on this band, as on every classic-MCP band, and inherited from the mint parent rather
# than re-decided here. Unimined provisions Minecraft by starting external java processes during Gradle's
# configuration phase, the mergetool merger and the access-transformer processor, and the configuration cache
# refuses to record either, so at the default strict mode the build reports "external process started" as a cache
# problem and fails on it. The generation makes no difference to the key: this band and its mint parent both
# provision through FG2 and 1.12.2 above them through FG3, and all three start those processes the same way.
# The failure only fires while the provision is cold, so a second local run passes, but CI checks out fresh and
# caches Gradle's home rather than the project's .gradle/unimined, so every CI run provisions cold and every CI
# run would fail. Degrading to warn instead was refused for the reason the original note gives: a cache that
# silently stops working is worse than one that is declared off. Do not tidy this key back to the default.
org.gradle.configuration-cache=false
# Toolchain provisioning is deliberately OFF. No toolchain download repository is configured (no
# foojay resolver), so Gradle already cannot download a JDK; this makes that explicit and future-proof
# against a later resolver add or a future Gradle that ships one. The build uses a locally detected JDK
# matching java_version below (auto-detection is a separate switch and stays on). Releases record the exact
# build JDK for byte-reproducibility, which a floating auto-provisioned patch would defeat: the
# toolchain spec pins only the major version and vendor, never the patch. See CONTRIBUTING.md.
org.gradle.java.installations.auto-download=false
minecraft_version=1.10.2
# The classic-MCP mapping coordinate Unimined provisions common's and the Forge island's Minecraft jar against
# (mappings { searge(); mcp(mcp_mappings_channel, mcp_mappings_version) }, read via band()/providers.gradleProperty
# in their respective build.gradle.kts). Stable channel, mapping-set 29-1.10.2, the latest stable export cut for
# the 1.10.2 line, which publishes 28-1.10.2 and 29-1.10.2 and nothing else. The export carries the full game
# version in its own suffix here, so coordinate and jar name the same version; the parent band's 1.11 line has no
# such export and takes a line-level 32-1.11 set instead. Coverage is better at this band than at the parent:
# 29-1.10.2 leaves 16 of 8661 methods and 639 of 9693 fields unnamed, against 22 of 8885 and 693 of 9941 for
# 32-1.11.
mcp_mappings_channel=stable
mcp_mappings_version=29-1.10.2
# No neoform_version: this band's Minecraft jar is provisioned by Unimined against the classic MCP mappings above
# (searge intermediary), not NeoForm. Below the Mojmap floor there is no Loom, no Legacy Fabric intermediary, and
# no Mojmap bridge to generate; NeoForm itself has no pre-1.20.2 release to target on this band regardless. See
# common/build.gradle.kts.
# No Parchment layer on this band: Parchment publishes no 1.10.2 mappings either (its releases still floor at
# 1.16.5), so both parchment_* keys are omitted. The MCP-named Minecraft carries MCP's own parameter names
# instead, which WDL never references.
java_version=8
# The exact JDK the CI workflows install, distinct from java_version above: that one is a language version and
# carries no patch, while a byte-reproducible release jar needs the patch pinned (see the auto-download note at
# the top). Its major must equal java_version; checkJavaVersion enforces that.
java_build_version=8.0.502
# This band drops :fabric from the root build entirely (Forge-only, below the Mojmap floor), so there is no
# fabric/build.gradle.kts left to read this key. It is kept here anyway, rather than removed, because an absent
# key defaults to true in capture-verification.yml, which would then try to run the now-nonexistent
# :fabric:runClientGameTest task; keeping it false makes that workflow green-skip with no workflow edit.
client_gametest=false

# Forge second-loader coordinate for the Forge island (forge/), a separate Gradle build that produces the
# non-Fabric jar for this deep band: NeoForge does not exist for 1.10.x (it forked from Forge at 1.20.2), so the
# second loader here is Forge. The island provisions Forge itself through Unimined's minecraftForge loader (fed
# this same coordinate) against the classic-MCP Minecraft above and reobfuscates natively, no hand-rolled
# Mojmap -> SRG step. Read by forge/build.gradle.kts, a separate Gradle build, from this file. forge_version is
# the real-Forge coordinate (the 12.18.x line for 1.10.2); forge_version_min is the runtime floor, kept as its own
# key even on a band where the two agree. This band ships no mods.toml to template the floor into: legacy FML reads
# it from WdlForge's own @Mod(dependencies = ...) string, which mirrors this value by hand because an annotation
# value must be a compile-time constant. checkForgeFloor in forge/build.gradle.kts gates the two against each other.
# forge_version is both 1.10.2-latest and 1.10.2-recommended on the Forge promotions index, which agree at this
# band. forge_version_min is pinned equal to forge_version because no measurable floor exists here. The parent
# band's floor was the build that added IModGuiFactory.hasConfigGui()/createConfigGui(); no 1.10.2 Forge build has
# either member, the interface carrying four members at this band rather than six, and IModGuiFactory.class is
# md5 4f660b0e445886a642dc66d0661c5a0d in all fourteen universal jars sampled from 12.18.0.2001 to 12.18.3.2511.
# The mods-list Config button is driven off the older mainConfigGuiClass() member instead, which every build in
# that range carries, so nothing in the range distinguishes builds for us. With no floor to measure, a lower pin
# would be an untested compatibility claim, and since latest and recommended are the same build the strictness
# costs no player anything.
forge_version=12.18.3.2511
forge_version_min=12.18.3.2511

# fastutil, the one third-party library this band's jar bundles. Minecraft carries fastutil on its own classpath
# on every band from 1.12.2 up (7.1.0 there, 8.5.x on the modern bands) and the mod has always relied on that,
# declaring it nowhere. This band's Minecraft ships fastutil_shipped_version instead, a 355-class trimmed cut of
# the same release, and nine of the twenty fastutil types the mod binds are absent from it, seven of those used
# from core/. fastutil_bundle_version is the untrimmed release the absent classes come from; it is the same
# version, Mojang's being a trimmed recompile of it, so a bundled class links against the game's own copies of
# its supertypes. Both are read by forge/build.gradle.kts, which walks the closure and packages only what the
# game does not already carry, and by common/build.gradle.kts for the compile classpath. The parent band left a
# standing instruction to re-verify both on a fork downward; it is discharged here. 1.10.2 and 1.11.2 declare the
# identical it.unimi.dsi:fastutil:7.0.12_mojang coordinate, from the same URL and at the same SHA-1, so the
# trimmed jar is byte-identical between the two bands and the same nine classes carry unchanged.
fastutil_shipped_version=7.0.12_mojang
fastutil_bundle_version=7.0.12

# No XaeroPlus overlay integration wired on this band, and that is a documented limit here, not a deferred task.
# XaeroPlus declares a game-version floor of 1.12.2, so it publishes nothing for 1.10.2 and there is no build to
# bind against and no draw API to assess. The JourneyMap overlay below covers the coverage-overlay need on this
# band, so nothing is lost by the gap. Revisitable only if XaeroPlus publishes a 1.10.2 line carrying a public draw
# API, or via a from-scratch WDL mixin render seam (this band ships no mixins).
# JourneyMap integration (optional soft-dependency), a compile-only API pin: nothing ships and nothing runs
# unless the player has JourneyMap. This band binds the 1.x API surface (journeymap.client.api), inherited from
# the parent band rather than reverted: there is no journeymap.api.v2 on the 1.10.x line either, and the blamejared
# journeymap-api-forge line the 2.0 API publishes under has nothing on 1.10.x. The artifact stays
# info.journeymap:journeymap-api on Maven Central, a plain release with no snapshot suffix; the 1.10.2 line
# publishes 1.10.2-1.3 and 1.10.2-1.4, and -1.4 is pinned to match the parent's minor. This band's -1.4 jar and the
# parent's differ in 2 of their 35 entries, neither a type WDL names. Both build scripts read this key,
# common/build.gradle.kts by property and forge/build.gradle.kts by band(). The API jar names its BlockPos in
# classic MCP, which is what this band compiles in, so nothing has to be reached reflectively.
journeymap_api_coordinate=1.10.2-1.4
mod_id=wdl
mod_group=world.thearchive.wdl
mod_archives_base=archive-wdl
mod_version=1.2.0
# Final artifacts: archive-wdl-<loader>-<mod_version>+<minecraft_version>.jar
# The +<mc> SemVer build-metadata tag is DERIVED from minecraft_version (above), so every
# branch self-names its jar from the version it targets: dev tracks the newest, snapshot
# branches (e.g. 1.21.4) keep their frozen one.

# Publishing coordinates: the project IDs on each distribution platform. The slug on both is the
# mod_id ('wdl'), so the page URLs derive from it. The update-check reads modrinth_id to query the
# release index (Modrinth allows anonymous reads once the project is public); CurseForge requires an
# API key even for reads, so it is a link target only, never a runtime index. Publishing tokens are
# NOT stored here; they live in the environment.
modrinth_id=x6JOJ1sf
curseforge_id=1554389
