org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache: OFF. Unimined's FG2 provision applies Forge's access transformers through an external java
# process during the configuration phase, which the configuration cache forbids, so a strict-mode build fails on every
# cold provision, and every clean-machine build provisions cold.
org.gradle.configuration-cache=false
org.gradle.java.installations.auto-download=false
minecraft_version=1.11.2
# This band's parent in the mint chain: checkBandDivergence diffs the tree against its tip and against dev.
mint_parent=1.12.2
mcp_mappings_channel=stable
mcp_mappings_version=32-1.11
java_version=8
# The exact JDK the CI workflows install, distinct from java_version above: that one is a language version and carries
# no patch, while a byte-reproducible release jar needs the patch pinned.
java_build_version=8.0.504
# Doclint's reference check (the javadoc task) is part of check on this band: a dangling javadoc reference fails the
# build.
javadoc_gate=true
# This band drops :fabric from the root build entirely (Forge-only, below the Mojmap floor), so there is no
# fabric/build.gradle.kts left to read this key. It is kept here anyway, rather than removed, because an absent
# key defaults to true in capture-verification.yml, which would then try to run the now-nonexistent
# :fabric:runClientGameTest task; keeping it false makes that workflow green-skip with no workflow edit.
client_gametest=false

# forge_version_min is the build that added IModGuiFactory.hasConfigGui()/createConfigGui().
forge_version=13.20.1.2588
forge_version_min=13.20.0.2262

# This band's Minecraft ships fastutil_shipped_version, a 355-class trimmed cut of the same release, and nine of the
# twenty fastutil types the mod binds are absent from it. fastutil_bundle_version is the untrimmed release the absent
# classes come from; it is the same version, Mojang's being a trimmed recompile of it, so a bundled class links against
# the game's own copies of its supertypes.
fastutil_shipped_version=7.0.12_mojang
fastutil_bundle_version=7.0.12

journeymap_api_coordinate=1.11.2-1.4
mod_id=wdl
mod_group=world.thearchive.wdl
mod_archives_base=archive-wdl
mod_version=1.3.0

modrinth_id=x6JOJ1sf
curseforge_id=1554389
