org.gradle.jvmargs=-Xmx3G
# Parallel project execution and the local build cache, both safe on a three-module build.
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache: the preferred mode of execution since Gradle 9.0. Left at the default
# strict mode (CC problems fail the build) so any future script-object capture is caught at once.
org.gradle.configuration-cache=true
# Toolchain provisioning is deliberately OFF. No toolchain download repository is configured (no
# foojay resolver), so Gradle already cannot download a JDK; this makes that explicit and future-proof
# against a later resolver add or a future Gradle that ships one. The build uses a locally detected JDK
# matching java_version below (auto-detection is a separate switch and stays on). Releases record the exact
# build JDK for byte-reproducibility, which a floating auto-provisioned patch would defeat: the
# toolchain spec pins only the major version and vendor, never the patch. See CONTRIBUTING.md.
org.gradle.java.installations.auto-download=false
minecraft_version=1.18.2
# No neoform_version: NeoForm has no 1.18.x release (NeoForged forked from Forge at 1.20.2, so no 1.18.x NeoForge
# exists at all), so common/ cannot use ModDevGradle Vanilla mode on this band. It builds Mojmap 1.18.2 through
# NeoGradle's vanilla plugin instead, which derives the sources from mcp_config 1.18.2 and needs no pinned
# NeoForm coordinate here. See common/build.gradle.kts.
parchment_minecraft_version=1.18.2
parchment_mappings_version=2022.11.06
java_version=17
# The exact JDK the CI workflows install, distinct from java_version above: that one is a language version and
# carries no patch, while a byte-reproducible release jar needs the patch pinned (see the auto-download note at
# the top). Its major must equal java_version; checkJavaVersion enforces that.
java_build_version=17.0.20
fabric_loader_version=0.19.3
# Runtime floor: the lowest loader that runs WDL, deliberately distinct from the build coordinate above
# (which tracks latest for dev). Derived from the bundled fabric-api's depends.fabricloader for this MC;
# below it Fabric API itself will not load and WDL adds no newer loader surface.
fabric_loader_version_min=0.14.9
fabric_api_version=0.77.0+1.18.2
# This Minecraft version predates the Fabric client game test framework (fabric-client-gametest-api-v1, first
# shipped at 1.21.4), so fabric/build.gradle.kts disables the capture-verification gametest tier on this band.
# Bands at 1.21.4 and above omit this key, which then defaults to true.
client_gametest=false
# This NeoForge line's FancyModLoader is the 1.0.x series, which has no published junit-fml (the FML JUnit
# helper the ModDevGradle unitTest FML-module smoke test needs; junit-fml is first published at 4.0.x for a
# later FancyModLoader). So neoforge/build.gradle.kts leaves the FML-module test tier off on this band and the
# NeoForge tests run plain-classpath. Bands above the floor omit this key, which then defaults to true.
neoforge_fml_unit_test=false
neoforge_version=20.2.91
# Runtime floor (see fabric_loader_version_min): NeoForge ships no declarative floor, so this is the
# earliest 20.2.x. WDL's client surface predates the cycle and the exact MC pin locks the band one-to-one.
neoforge_version_min=20.2.3-beta

# Forge second-loader coordinate for the ForgeGradle-6 Gradle-8 island (forge/), which builds the non-Fabric
# jar for this deep band: NeoForge does not exist for 1.18.x (it forked from Forge at 1.20.2), so the second
# loader here is Forge on the older ForgeGradle toolchain. Read by forge/build.gradle.kts, which is a separate
# Gradle build, from this file. forge_version is the FG6 dependency coordinate (the latest 40.x for 1.18.2);
# forge_version_min is the runtime floor written into mods.toml, deliberately distinct from the build coordinate
# as the Fabric floor is.
forge_version=1.18.2-40.3.12
forge_version_min=40.0.0

# No XaeroPlus overlay integration on this band: XaeroPlus publishes no 1.18.x build for either loader (its
# oldest release is 1.19.2), so there is no coordinate to compile the compat/xaeroplus binding against. The
# overlay is dropped here as a disclosed limit, the way an integration below its API availability floor is; the
# JourneyMap overlay below covers the same coverage-map role where its API does resolve.
# ModMenu integration (optional soft-dependency): the Fabric mod-list config button opens the settings screen
# via a modmenu entrypoint. Compile-only API pin (Loom remaps it to Mojmap); nothing ships and nothing is
# required at runtime, so the entrypoint loads only when the player has ModMenu. Users bring their own ModMenu
# for the running MC version; this coordinate only supplies the stable ModMenuApi to compile against.
modmenu_version=3.2.5
# JourneyMap integration (optional soft-dependency), a compile-only API pin: nothing ships and nothing runs
# unless the player has JourneyMap. Pre-1.21 JourneyMap bundles the older 1.9 API generation
# (journeymap.client.api), published on jm.gserv.me as info.journeymap:journeymap-api:<mc>-1.9-<loader>-SNAPSHOT.
# This band binds that 1.9 API alone: JourneyMap publishes a 1.18.2-1.9 stem, and no 2.0 API jar exists for
# 1.18.2, so there is no second generation to bind. The stem publishes the -fabric-SNAPSHOT and the
# loader-suffixless -SNAPSHOT flavors, so fabric/build.gradle.kts appends -fabric-SNAPSHOT while
# common/build.gradle.kts and the Forge island append the plain -SNAPSHOT.
journeymap_api_coordinate=1.18.2-1.9
mod_id=wdl
mod_group=world.thearchive.wdl
mod_archives_base=archive-wdl
mod_version=1.1.0
# Final artifacts: archive-wdl-<loader>-<mod_version>+<minecraft_version>.jar
# The +<mc> SemVer build-metadata tag is DERIVED from minecraft_version (above), so every
# branch self-names its jar from the version it targets: dev tracks the newest, snapshot
# branches (e.g. 1.21.4) keep their frozen one.

# Publishing coordinates: the project IDs on each distribution platform. The slug on both is the
# mod_id ('wdl'), so the page URLs derive from it. The update-check reads modrinth_id to query the
# release index (Modrinth allows anonymous reads once the project is public); CurseForge requires an
# API key even for reads, so it is a link target only, never a runtime index. Publishing tokens are
# NOT stored here; they live in the environment.
modrinth_id=x6JOJ1sf
curseforge_id=1554389
