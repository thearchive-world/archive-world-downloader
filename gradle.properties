org.gradle.jvmargs=-Xmx3G
# Parallel project execution and the local build cache, both safe on a three-module build.
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache: the preferred mode of execution since Gradle 9.0. Left at the default
# strict mode (CC problems fail the build) so any future script-object capture is caught at once.
org.gradle.configuration-cache=true
# Toolchain provisioning is deliberately OFF. No toolchain download repository is configured (no
# foojay resolver), so Gradle already cannot download a JDK; this makes that explicit and future-proof
# against a later resolver add or a future Gradle that ships one. The build uses a locally detected JDK
# matching java_version below (auto-detection is a separate switch and stays on). Releases record the exact
# build JDK for byte-reproducibility, which a floating auto-provisioned patch would defeat: the
# toolchain spec pins only the major version and vendor, never the patch. See CONTRIBUTING.md.
org.gradle.java.installations.auto-download=false
minecraft_version=1.21.11
neoform_version=1.21.11-20251209.172050
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20
java_version=21
# The exact JDK the CI workflows install, distinct from java_version above: that one is a language version and
# carries no patch, while a byte-reproducible release jar needs the patch pinned (see the auto-download note at
# the top). Its major must equal java_version; checkJavaVersion enforces that.
java_build_version=21.0.11
fabric_loader_version=0.19.3
# Runtime floor: the lowest loader that runs WDL, deliberately distinct from the build coordinate above
# (which tracks latest for dev). Derived from the bundled fabric-api's depends.fabricloader for this MC;
# below it Fabric API itself will not load and WDL adds no newer loader surface.
fabric_loader_version_min=0.17.3
fabric_api_version=0.141.4+1.21.11
neoforge_version=21.11.42
# Runtime floor (see fabric_loader_version_min): NeoForge ships no declarative floor, so this is the
# earliest 21.11.x. WDL's client surface predates the cycle and the exact MC pin locks the band one-to-one.
neoforge_version_min=21.11.0-beta

# XaeroPlus overlay integration (optional soft-dependency). Reference-band (1.21.11) coordinate for the
# compile-only binding in compat/xaeroplus; other bands carry band-shifted versions. Only this XaeroPlus
# coordinate is a build input: the binding needs XaeroPlus at compile only, and XaeroPlus hard-depends on
# xaeroworldmap, so the whole Xaero family would block the headless gametest and is kept off every run.
# Xaero's worldmap/minimap/lib coordinates for the external-launcher
# render gate are not build inputs and are not pinned here.
xaeroplus_version=2.34.1
# ModMenu integration (optional soft-dependency): the Fabric mod-list config button opens the settings screen
# via a modmenu entrypoint. Compile-only API pin (Loom remaps it to Mojmap); nothing ships and nothing is
# required at runtime, so the entrypoint loads only when the player has ModMenu. Users bring their own ModMenu
# for the running MC version; this coordinate only supplies the stable ModMenuApi to compile against.
modmenu_version=17.0.0
# JourneyMap integration (optional soft-dependency). Reference-band (1.21.11)
# coordinate for the compile-only binding in compat/journeymap. Compile-only API pin; nothing ships and
# nothing is required at runtime, so the entrypoint loads only when the player has JourneyMap.
journeymap_api_version=2.0.0
mod_id=wdl
mod_group=world.thearchive.wdl
mod_archives_base=archive-wdl
mod_version=1.0.0-SNAPSHOT
# Final artifacts: archive-wdl-<loader>-<mod_version>+<minecraft_version>.jar
# The +<mc> SemVer build-metadata tag is DERIVED from minecraft_version (above), so every
# branch self-names its jar from the version it targets: dev tracks the newest, snapshot
# branches (e.g. 1.21.4) keep their frozen one.

# Publishing coordinates: the project IDs on each distribution platform. The slug on both is the
# mod_id ('wdl'), so the page URLs derive from it. The update-check reads modrinth_id to query the
# release index (Modrinth allows anonymous reads once the project is public); CurseForge requires an
# API key even for reads, so it is a link target only, never a runtime index. Publishing tokens are
# NOT stored here; they live in the environment.
modrinth_id=x6JOJ1sf
curseforge_id=1554389
