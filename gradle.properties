org.gradle.jvmargs=-Xmx3G
# Parallel project execution and the local build cache, both safe on a three-module build.
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache: OFF on this band. It was opt-in on this band's Gradle 8.14.5, unlike the Gradle 9+ bands
# where it is the preferred default, and was left on at the default strict mode (cache problems fail the build) so
# that the first real test of it against Unimined's FG3 provision would either pass clean or fail loud rather than
# silently degrade to a cache-less run. It failed loud on the first cold provision: FG3 starts external java
# processes during the configuration phase, the mergetool merger and the access-transformer processor, and the
# configuration cache refuses to record either, so the build reports "external process started" as a cache problem
# and fails on it in strict mode.
# The failure only fires while the provision is cold, so a second local run passes, but a fresh checkout caches
# Gradle's home rather than the project's .gradle/unimined, so every clean-machine build provisions cold and every
# one of them fails. Degrading to warn instead was refused: a cache that silently stops working is worse than one
# that is declared off.
org.gradle.configuration-cache=false
# Toolchain provisioning is deliberately OFF. No toolchain download repository is configured (no
# foojay resolver), so Gradle already cannot download a JDK; this makes that explicit and future-proof
# against a later resolver add or a future Gradle that ships one. The build uses a locally detected JDK
# matching java_version below (auto-detection is a separate switch and stays on). Releases record the exact
# build JDK for byte-reproducibility, which a floating auto-provisioned patch would defeat: the
# toolchain spec pins only the major version and vendor, never the patch. See CONTRIBUTING.md.
org.gradle.java.installations.auto-download=false
minecraft_version=1.12.2
# The classic-MCP mapping coordinate Unimined provisions common's and the Forge island's Minecraft jar against
# (mappings { searge(); mcp(mcp_mappings_channel, mcp_mappings_version) }, read via band()/providers.gradleProperty
# in their respective build.gradle.kts). Stable channel, mapping-set 39-1.12, the last MCP release cut for 1.12.2.
mcp_mappings_channel=stable
mcp_mappings_version=39-1.12
# No neoform_version: this band's Minecraft jar is provisioned by Unimined against the classic MCP mappings above
# (searge intermediary), not NeoForm. Below the Mojmap floor there is no Loom, no Legacy Fabric intermediary, and
# no Mojmap bridge to generate; NeoForm itself has no pre-1.20.2 release to target on this band regardless. See
# common/build.gradle.kts.
# No Parchment layer on this band: Parchment publishes no 1.12.2 mappings either (its releases still floor at
# 1.16.5), so both parchment_* keys are omitted. The MCP-named Minecraft carries MCP's own parameter names
# instead, which WDL never references.
java_version=8
# The exact JDK the CI workflows install, distinct from java_version above: that one is a language version and
# carries no patch, while a byte-reproducible release jar needs the patch pinned (see the auto-download note at
# the top). Its major must equal java_version; checkJavaVersion enforces that.
java_build_version=8.0.502
# This band drops :fabric from the root build entirely (Forge-only, below the Mojmap floor), so there is no
# fabric/build.gradle.kts left to read this key. It is kept here anyway, rather than removed, because an absent
# key defaults to true in capture-verification.yml, which would then try to run the now-nonexistent
# :fabric:runClientGameTest task; keeping it false makes that workflow green-skip with no workflow edit.
client_gametest=false

# Forge second-loader coordinate for the Forge island (forge/), a separate Gradle build that produces the
# non-Fabric jar for this deep band: NeoForge does not exist for 1.12.x (it forked from Forge at 1.20.2), so the
# second loader here is Forge. The island provisions Forge itself through Unimined's minecraftForge loader (fed
# this same coordinate) against the classic-MCP Minecraft above and reobfuscates natively, no hand-rolled
# Mojmap -> SRG step. Read by forge/build.gradle.kts, a separate Gradle build, from this file. forge_version is
# the real-Forge coordinate (the 14.23.5.x line for 1.12.2); forge_version_min is the runtime floor, deliberately
# distinct from the build coordinate. This band ships no mods.toml to template the floor into: legacy FML reads it
# from WdlForge's own @Mod(dependencies = ...) string, which mirrors this value by hand because an annotation value
# must be a compile-time constant. checkForgeFloor in forge/build.gradle.kts gates the two against each other.
forge_version=14.23.5.2860
forge_version_min=14.23.5.2768

# No XaeroPlus overlay integration wired on this band, and that is a documented limit here, not a deferred task.
# XaeroPlus does publish a 1.12.2 Forge build (build 197), but its 1.12.2 line is a separate RetroFuturaGradle
# backport that exposes no public draw API: it carries no DrawFeatureFactory/DrawManager registry for compat to
# bind against the way the modern bands do, and its own chunk highlights are hardcoded internal mixins with
# nothing WDL can hook. The JourneyMap overlay below covers the coverage-overlay need on this band, so nothing is
# lost by the gap. Revisitable only if XaeroPlus adds a public draw API to its 1.12.2 line upstream, or via a
# from-scratch WDL mixin render seam (this band ships no mixins).
# JourneyMap integration (optional soft-dependency), a compile-only API pin: nothing ships and nothing runs
# unless the player has JourneyMap. Only JourneyMap 6.x serves this band, carrying the 2.0 API
# (journeymap.api.v2) jar-in-jar and providing it at runtime, so the pin stays compile-only with no bundling and
# this band binds the 2.0 API alone (compat/journeymap/v2); there is no 5.x line here (the superseded
# journeymap_api_coordinate pinned a 1.14.4 build of the 1.x/5.x journeymap.client.api surface, which 6.x does
# not bundle, so the plugin never loaded). Published on blamejared as
# info.journeymap:journeymap-api-{common,forge}:<this>; this island takes the -forge flavor, not -common: the
# island compiles under classic MCP mappings (net.minecraft.util.math.BlockPos, int dimension ids), which is what
# the -forge flavor carries at this band, while -common carries official Mojang names that do not exist below the
# Mojmap floor. forge/build.gradle.kts reads this key too, via band("journeymap_api_v2_coordinate").
journeymap_api_v2_coordinate=1.12.2-2.0.0
mod_id=wdl
mod_group=world.thearchive.wdl
mod_archives_base=archive-wdl
mod_version=1.1.0
# Final artifacts: archive-wdl-<loader>-<mod_version>+<minecraft_version>.jar
# The +<mc> SemVer build-metadata tag is DERIVED from minecraft_version (above), so every
# branch self-names its jar from the version it targets: dev tracks the newest, snapshot
# branches (e.g. 1.21.4) keep their frozen one.

# Publishing coordinates: the project IDs on each distribution platform. The slug on both is the
# mod_id ('wdl'), so the page URLs derive from it. The update-check reads modrinth_id to query the
# release index (Modrinth allows anonymous reads once the project is public); CurseForge requires an
# API key even for reads, so it is a link target only, never a runtime index. Publishing tokens are
# NOT stored here; they live in the environment.
modrinth_id=x6JOJ1sf
curseforge_id=1554389
