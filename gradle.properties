org.gradle.jvmargs=-Xmx3G
# Parallel project execution and the local build cache, both safe on a three-module build.
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache: the preferred mode of execution since Gradle 9.0. Left at the default
# strict mode (CC problems fail the build) so any future script-object capture is caught at once.
org.gradle.configuration-cache=true
# Toolchain provisioning is deliberately OFF. No toolchain download repository is configured (no
# foojay resolver), so Gradle already cannot download a JDK; this makes that explicit and future-proof
# against a later resolver add or a future Gradle that ships one. The build uses a locally detected JDK
# matching java_version below (auto-detection is a separate switch and stays on). Releases record the exact
# build JDK for byte-reproducibility, which a floating auto-provisioned patch would defeat: the
# toolchain spec pins only the major version and vendor, never the patch. See CONTRIBUTING.md.
org.gradle.java.installations.auto-download=false
minecraft_version=1.13.2
# No neoform_version: this band builds common/ with Fabric Loom in vanilla mode, not ModDevGradle or NeoGradle, so
# it consumes no NeoForm coordinate at all. Loom provisions the vanilla 1.13.2 jar and remaps it to Mojmap names via
# Legacy Fabric's intermediary plus the composed intermediary->Mojmap bridge (tools/mojmap-bridge); NeoForm has no
# pre-1.20.2 release to target on this band regardless. See common/build.gradle.kts.
# No Parchment layer on this band: Parchment publishes no 1.13.2 mappings either (its releases still floor at
# 1.16.5), so both parchment_* keys are omitted. The decompiled Minecraft then carries generated parameter
# names, which WDL never references.
java_version=8
# The exact JDK the CI workflows install, distinct from java_version above: that one is a language version and
# carries no patch, while a byte-reproducible release jar needs the patch pinned (see the auto-download note at
# the top). Its major must equal java_version; checkJavaVersion enforces that.
java_build_version=8.0.502
# This band drops :fabric from the root build entirely (Forge-only, below the Mojmap floor), so there is no
# fabric/build.gradle.kts left to read this key. It is kept here anyway, rather than removed, because an absent
# key defaults to true in capture-verification.yml, which would then try to run the now-nonexistent
# :fabric:runClientGameTest task; keeping it false makes that workflow green-skip with no workflow edit.
client_gametest=false

# Forge second-loader coordinate for the hand-rolled plain-java island (forge/), which builds the non-Fabric jar for
# this deep band with no ForgeGradle and no Loom: NeoForge does not exist for 1.13.x (it forked from Forge at
# 1.20.2), so the second loader here is Forge. The island compiles against the Mojmap Minecraft plus a Mojmap-named
# view of the real Forge 1.13.2-25.0.223 universal jar, then reobfuscates Mojmap -> SRG by hand and packages. Read by
# forge/build.gradle.kts, a separate Gradle build, from this file. forge_version is that real-Forge coordinate (the
# 25.x line for 1.13.2); forge_version_min is the runtime floor written into mods.toml, deliberately distinct from
# the build coordinate.
forge_version=1.13.2-25.0.223
forge_version_min=25.0.0

# No XaeroPlus overlay integration on this band: XaeroPlus publishes no 1.13.x build for either loader (its
# builds skip 1.13 through 1.18), so there is no coordinate to compile the compat/xaeroplus binding against. The
# overlay is dropped here as a disclosed limit, the way an integration below its API availability floor is; the
# JourneyMap overlay below covers the same coverage-map role on Forge, where its API does resolve.
# JourneyMap integration (optional soft-dependency), a compile-only API pin: nothing ships and nothing runs
# unless the player has JourneyMap. The 1.14.4 JourneyMap (5.7.0) is Forge-only and bundles the older 1.x API
# generation (journeymap.client.api, no MapPolygonWithHoles). jm.gserv.me publishes a native 1.14.4 stem on that
# generation, 1.14.4-1.5, so the binding compiles directly against it, its journeymap.client.api methods naming
# 1.14.4 Mojmap Minecraft types with no borrowed-coordinate reflection; the -SNAPSHOT suffix is appended per
# build script. The Forge jar loads the plugin by JourneyMap's annotation scan; the Fabric jar carries no
# journeymap entrypoint, since no Fabric JourneyMap exists at this band.
journeymap_api_coordinate=1.14.4-1.5
mod_id=wdl
mod_group=world.thearchive.wdl
mod_archives_base=archive-wdl
mod_version=1.1.0
# Final artifacts: archive-wdl-<loader>-<mod_version>+<minecraft_version>.jar
# The +<mc> SemVer build-metadata tag is DERIVED from minecraft_version (above), so every
# branch self-names its jar from the version it targets: dev tracks the newest, snapshot
# branches (e.g. 1.21.4) keep their frozen one.

# Publishing coordinates: the project IDs on each distribution platform. The slug on both is the
# mod_id ('wdl'), so the page URLs derive from it. The update-check reads modrinth_id to query the
# release index (Modrinth allows anonymous reads once the project is public); CurseForge requires an
# API key even for reads, so it is a link target only, never a runtime index. Publishing tokens are
# NOT stored here; they live in the environment.
modrinth_id=x6JOJ1sf
curseforge_id=1554389
