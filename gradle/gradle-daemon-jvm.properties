# The Gradle daemon runs on Java 21 independently of the compile toolchain: a plugin the root build resolves
# declares a runtime requirement in its metadata that the java_build_version JDK does not meet, so a daemon on
# that JDK cannot configure the build. This pins the daemon JVM by toolchain criteria, found by Gradle's
# installation detection (auto-download stays off); the mod bytecode target is unaffected, since
# wdl.java-conventions sets the compile toolchain on its own from gradle.properties. The forge/ island keeps its
# own Gradle wrapper and does not read this file.
toolchainVersion=21
