# The Gradle daemon runs on Java 21 while the compile toolchain stays at java_version (17): fabric-loom 1.17.19
# declares a Java-21 runtime requirement in its plugin metadata, so the launching JVM alone (CI installs the
# java_build_version JDK, 17) cannot configure the build. This pins the daemon JVM by toolchain criteria, found
# by Gradle's installation detection (auto-download stays off); the mod bytecode target is unaffected, since the
# compile toolchain is a separate Java 17 resolved by wdl.java-conventions. The forge/ island keeps its own
# Gradle 8.1.1 wrapper on Java 17 and does not read this file.
toolchainVersion=21
