[versions]
loom = "1.17.21"
spotless = "8.10.2"
errorprone-plugin = "5.1.1"

[plugins]
loom = { id = "fabric-loom", version.ref = "loom" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

[libraries]
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }

jspecify        = { module = "org.jspecify:jspecify",                  version = "1.0.0" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version = "2.50.0" }
nullaway        = { module = "com.uber.nullaway:nullaway",             version = "0.14.1" }
junit-bom       = { module = "org.junit:junit-bom",                    version = "5.14.4" }

asm             = { module = "org.ow2.asm:asm",                        version = "9.10.1" }
