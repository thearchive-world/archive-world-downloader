# tools/mojmap-bridge is a nested Gradle build (its own 9.7 wrapper), spawned from settings.gradle.kts by the
# GenerateMojmapBridge value source as `./gradlew genBridge`. That child process inherits the CI JAVA_HOME (the
# java_build_version JDK, 8), on which Gradle 9.7 cannot run ("Gradle requires JVM 17 or later to run"). This
# pins the bridge daemon to Java 21 by toolchain criteria, found by Gradle's installation detection (auto-
# download stays off); it mirrors the root and forge builds' own gradle/gradle-daemon-jvm.properties.
toolchainVersion=21
