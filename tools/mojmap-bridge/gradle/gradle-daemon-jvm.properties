# tools/mojmap-bridge is a nested Gradle build with its own wrapper, spawned from settings.gradle.kts by the
# GenerateMojmapBridge value source as ./gradlew genBridge. That child's wrapper picks its JVM from the inherited
# JAVA_HOME, a JDK 8 wherever the java_build_version JDK is the default one, and no Gradle 9 daemon runs below
# JVM 17. This pins the bridge daemon to Java 21 by toolchain criteria, found by Gradle's installation detection,
# the mechanism the root and forge builds' own gradle/gradle-daemon-jvm.properties use.
toolchainVersion=21
